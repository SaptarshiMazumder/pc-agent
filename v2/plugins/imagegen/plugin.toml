id = "imagegen"
name = "Image Generation"
kind = "native"
entry = "imagegen_plugin:register"

# Default provider (gemini) uses the google-genai SDK (already a core dep) + GEMINI_API_KEY/
# GOOGLE_API_KEY. Optional providers give cheaper generation with REAL ControlNet conditioning:
#   fal       -> `pip install fal-client` + FAL_KEY            (fal.ai, $10 minimum)
#   replicate -> `pip install replicate`  + REPLICATE_API_TOKEN (no minimum; takes Civitai/HF LoRAs)
# family = flux (default) | sdxl. All backends error gracefully at call time if their key/dep is
# missing, so the plugin always loads for inspection. No [requires] gate. Pick per call (`provider=`,
# `family=`) or in config via plugins.imagegen.provider (+ plugins.imagegen.model for the endpoint).
