id = "figure-art"
name = "Figure Art"
kind = "native"
entry = "figure_art_plugin:register"
description = "Generate textless scientific-figure ARTWORK (illustrations/scenes) for the figure-creator pipeline: templated raster art via Gemini's Nano Banana (or fal/replicate FLUX), reference-image grounding, and the art-template gallery. Not a general image generator — it's the artwork half of figure creation."

# The figure ARTWORK engine (was 'imagegen' — renamed so a future general image-gen plugin can own
# that name). Default provider (gemini) uses the google-genai SDK (already a core dep) + GEMINI_API_KEY/
# GOOGLE_API_KEY. Optional providers give cheaper generation with REAL ControlNet conditioning:
#   fal       -> `pip install fal-client` + FAL_KEY            (fal.ai, $10 minimum)
#   replicate -> `pip install replicate`  + REPLICATE_API_TOKEN (no minimum; takes Civitai/HF LoRAs)
# family = flux (default) | sdxl. All backends error gracefully at call time if their key/dep is
# missing, so the plugin always loads for inspection. No [requires] gate. Pick per call (`provider=`,
# `family=`) or in config via plugins.figure-art.provider (+ plugins.figure-art.model for the endpoint).
