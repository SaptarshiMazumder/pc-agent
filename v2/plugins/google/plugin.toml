# Google Workspace — an MCP plugin. The tools come from the `workspace-mcp` server (launched
# below); the plugin ALSO contributes the "## Google accounts" prompt block via its entry, so
# nothing Google-specific lives in the core anymore.
id    = "google"
name  = "Google Workspace"
kind  = "mcp"
entry = "google_plugin:register"   # contributes the prompt section (no tools — those are the MCP's)

[mcp]
command = ["uvx", "workspace-mcp", "--tools", "gmail", "drive", "calendar"]
env = { OAUTHLIB_INSECURE_TRANSPORT = "1" }
# OAuth client id/secret are read by workspace-mcp from the process env (GOOGLE_OAUTH_CLIENT_ID /
# GOOGLE_OAUTH_CLIENT_SECRET in .env) — inherited, not duplicated here.
