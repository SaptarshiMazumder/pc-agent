# Static hosting for the web client. SPA fallback so deep links resolve to index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # long-cache the hashed assets; never cache index.html (so a redeploy is picked up)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
