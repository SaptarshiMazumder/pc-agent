# HOSTED-DEV flavor — the full hosted-platform product wired to LOCALHOST services, for
# end-to-end testing before (and without) AWS:
#   accounts:  python v2/accounts/run-local.py             (:4100)
#   model proxy: python v2/model_proxy/run-local.py        (:4000, custom auth; set
#              ACCOUNTS_URL=http://127.0.0.1:4100 and ACCOUNTS_INTERNAL_KEY=devinternal)
#   registry:  python v2/deploy/registry/publish.py --serve  (:8877, signed local index)
#
# Shortcut for the first two: `python v2/deploy/dev.py --model-proxy --no-web` starts accounts
# + the proxy already wired to each other (and a spare hosted daemon on :8790, harmless here —
# this flavor's shell spawns its OWN daemon on :8787).
#
# Run the desktop shell against it:   AGENTD_FLAVOR=hosted-dev npm run dev
# Expected flow: sign-in gate on first launch -> signup -> Store lists the published agents
# -> install -> chat runs with NO local provider keys (watch the gateway/accounts logs).

[product]
id = "agentd-hosted-dev"
name = "agentd (hosted dev)"

[store]
enabled = true
registry_url = "http://127.0.0.1:8877/index.json"
# publisher_key = "<paste the base64 public key from `agentd bundle keygen` to test signing>"

[platform]
accounts_url = "http://127.0.0.1:4100"
model_proxy_url = "http://127.0.0.1:4000"
