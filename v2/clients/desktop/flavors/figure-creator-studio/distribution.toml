# FIGURE CREATOR STUDIO — the specialized-SKU flavor (M6): same codebase, this one
# file makes it a different product. The shell brands itself from [product]; the
# daemon it spawns inherits this file (AGENTD_DISTRIBUTION) so provisioning, the
# default agent, and store wiring all match the installer.
#
# The figure-creator bundle itself ships as flavors/figure-creator-studio/bundles/
# figure-creator-<ver>.agentpkg (placed by the build script); the shell preinstalls
# it on first run via the ordinary marketplace flow — one install path everywhere.

[product]
id = "figure-creator-studio"
name = "Figure Creator Studio"
default_agent = "figure-creator"
preinstalled_bundles = ["figure-creator"]

[provisioning]
# Only what the Studio needs: the figure pipeline + the core capabilities it rides on.
# Bundle installs UNION into this set automatically (acquired addons join the profile).
plugins = [
  "core_fs", "shell", "web", "skills", "memory", "planning", "resources", "authoring",
  "html", "figures", "figure-art", "vision", "vectorize", "figexport",
]

[store]
enabled = true            # a standalone SKU still upsells other agents
registry_url = "https://agentd-staging-registry-274ab2e9.s3.ap-northeast-1.amazonaws.com/index.json"
publisher_key = "Fkez25JIQDUtvwvyghwGdY2Mw//fDG7ITZCmB7CG7Nc="

# [platform] — hosted accounts + platform model keys: this build signs in and runs
# figure-creator on OUR keys (HTTP for the private-testing phase; switch to https + rebuild
# once TLS lands). Same endpoints as the core flavor.
[platform]
# THE ONE ADDRESS THIS BUILD BAKES. Everything else about the deployment — where to sign in,
# the model proxy, which issuer's tokens to trust, which login providers to offer — is fetched
# from <platform_url>/.well-known/agentd-platform at runtime.
#
# It replaced four independently-baked ALB hostnames. Each of those carries an AWS-assigned
# suffix that changes on any destroy/recreate, and nothing forced sync-platform-urls to run
# before a build — so every release froze another stale set, and the artifacts under dist/ point
# at three different long-dead load balancers. The user-visible symptom was not an obvious
# failure: two clients built at different times signed in against two different accounts
# databases, so the same email was two accounts with two separate credit balances.
#
# The keys below it are FALLBACKS, used only when discovery cannot be reached (offline) or by a
# client too old to know about it.
platform_url = "https://staging.thorgodofthunder.site:4100"
accounts_url = "https://staging.thorgodofthunder.site:4100"
model_proxy_url = "https://staging.thorgodofthunder.site:4000"
# Opt-in diagnostics, default off. Declared so sync-platform-urls can keep it current — it
# retargets existing keys and never adds one.
ingest_url = "https://staging.thorgodofthunder.site:4200"
