# FIGURE CREATOR STUDIO — the specialized-SKU flavor (M6): same codebase, this one
# file makes it a different product. The shell brands itself from [product]; the
# daemon it spawns inherits this file (AGENTD_DISTRIBUTION) so provisioning, the
# default agent, and store wiring all match the installer.
#
# The figure-creator bundle itself ships as flavors/figure-creator-studio/bundles/
# figure-creator-<ver>.agentpkg (placed by the build script); the shell preinstalls
# it on first run via the ordinary marketplace flow — one install path everywhere.

[product]
id = "figure-creator-studio"
name = "Figure Creator Studio"
default_agent = "figure-creator"
preinstalled_bundles = ["figure-creator"]

[provisioning]
# Only what the Studio needs: the figure pipeline + the core capabilities it rides on.
# Bundle installs UNION into this set automatically (acquired addons join the profile).
plugins = [
  "core_fs", "shell", "web", "skills", "memory", "planning", "resources", "authoring",
  "html", "figures", "figure-art", "vision", "vectorize", "figexport",
]

[store]
enabled = true            # a standalone SKU still upsells other agents
registry_url = "https://agentd-dev-registry-910828b2.s3.ap-northeast-1.amazonaws.com/index.json"
publisher_key = "gYM/XoS5CZo1yNAdW2Ai4HwnLNDlJhl/nvJUh5TavFY="

# [platform] — hosted accounts + platform model keys: this build signs in and runs
# figure-creator on OUR keys (HTTP for the private-testing phase; switch to https + rebuild
# once TLS lands). Same endpoints as the core flavor.
[platform]
accounts_url = "http://agentd-dev-978186267.ap-northeast-1.elb.amazonaws.com:4100"
model_gateway_url = "http://agentd-dev-978186267.ap-northeast-1.elb.amazonaws.com:4000"
