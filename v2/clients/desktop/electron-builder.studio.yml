# FIGURE CREATOR STUDIO flavor installer (M6). Build: npm run dist:studio
# Same code, different resources: the Studio distribution.toml (branding +
# provisioning + default agent) and the preinstalled figure-creator bundle
# (flavors/figure-creator-studio/bundles/*.agentpkg — produced by
# `agentd bundle pack agents/figure-creator`).
appId: dev.agentd.figure-creator-studio
productName: Figure Creator Studio
# npm WORKSPACES: electron-builder's implicit "installing production dependencies" step runs an
# install rooted at the WORKSPACE (clients/), which prunes every devDependency there — it wiped
# vite/electron-vite/typescript out of clients/node_modules on the first run. Nothing this app
# externalizes is native (`ws` and `@iarna/toml` are pure JS; the renderer is bundled by vite),
# so the rebuild buys nothing and is turned off.
npmRebuild: false
directories:
  output: dist/studio
files:
  - out/**
extraResources:
  - from: flavors/figure-creator-studio/distribution.toml
    to: distribution.toml
  - from: flavors/figure-creator-studio/bundles
    to: bundles
    filter: ['*.agentpkg']
  - from: runtime/cpython
    to: python
    filter: ['**/*']
  # Same as the core flavor: the browser playwright does NOT ship with. See electron-builder.yml.
  - from: runtime/ms-playwright
    to: ms-playwright
    filter: ['**/*']
  # NODE + npm. An agent's window is a React project compiled from app/ into ui/, and only ui/
  # is served -- so without this a user who built an agent through Agent Builder has no way to
  # rebuild its window. supervisor.ts puts this on the daemon's PATH.
  - from: runtime/node
    to: node
    filter: ['**/*']
  # THE SHARED AGENT-APP DEPENDENCIES. react + vite, installed once for the product rather than
  # once per agent -- so creating an agent costs no download and works offline. build_app links
  # each agent's app/node_modules at this tree; supervisor.ts passes the path down.
  - from: runtime/app-deps
    to: app-deps
    filter: ['**/*']
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false # per-user install: runtime pip-plugins can write, no admin, avoids the Program Files cache-permission errors
  allowToChangeInstallationDirectory: true
