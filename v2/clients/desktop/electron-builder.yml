# CORE flavor installer. Build: npm run dist:core
# Prereq (packaged daemon): scripts/build-runtime.ps1 assembles runtime/cpython
# (a RELOCATABLE python-build-standalone CPython with the agentd wheel installed into
# its own site-packages — pip stays alive for marketplace pip-plugins). Without it the
# installer still works and falls back to an `agentd` on PATH (see supervisor.ts).
appId: dev.agentd.desktop
productName: agentd
directories:
  output: dist/core
files:
  - out/**
extraResources:
  - from: flavors/core/distribution.toml
    to: distribution.toml
  - from: runtime/cpython
    to: python
    filter: ['**/*']
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false # per-user install: runtime pip-plugins can write, no admin, avoids the Program Files cache-permission errors
  allowToChangeInstallationDirectory: true
