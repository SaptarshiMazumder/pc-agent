<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The window's title bar. Set it to the agent's name — it is also what the SDK's sign-in
         gate uses for its heading, so naming the product twice is not needed. -->
    <title>Comfy Penguin</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="module" crossorigin src="./assets/index-B1Rd3eCU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJFzfC1W.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- THE POLICY LINKS, OUTSIDE #root ON PURPOSE.
         React's createRoot empties its container on mount, so fallback content inside #root would
         flash and disappear. These must be visible on the SIGN-IN screen too -- that is the only
         page a payment-gateway reviewer or a first-time visitor ever sees -- and the sign-in card
         comes from src/common/, which validate_agent compares against the platform's own copy and
         which this agent must not edit. A sibling of #root is the one place that is reachable from
         every state of the app and owned by this agent.

         pointer-events: none on the strip, auto on the links: the bar spans the window so the text
         can centre, and without this it would swallow clicks meant for whatever sits beneath it. -->
    <nav class="site-legal" aria-label="Policies">
      <a class="secondary" href="about.html">About</a>
      <a class="secondary" href="contact.html">Contact</a>
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="refund.html">Refunds</a>
      <a class="secondary" href="delivery.html">Delivery</a>
    </nav>
    <style>
      .site-legal {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 3px;
        z-index: 2147483000;
        display: flex;
        gap: 0.85rem;
        justify-content: center;
        flex-wrap: wrap;
        pointer-events: none;
        font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .site-legal a {
        pointer-events: auto;
        color: currentColor;
        opacity: 0.55;
        text-decoration: none;
        /* Legible on whatever the app paints behind it, dark or light, without knowing which. */
        mix-blend-mode: difference;
        transition: opacity 120ms ease;
      }
      .site-legal a:hover,
      .site-legal a:focus-visible { opacity: 0.95; text-decoration: underline; }
      /* A PHONE STILL GETS THEM. This started as `display: none` below 640px, to keep the strip
         off the composer -- which left a phone with no route to the policies at all, on the
         devices most of these users are on. The composer owns the bottom edge there, so the
         strip moves to the top-right gutter instead, and thins to the three links a customer or
         a payment reviewer actually comes looking for. The other three stay one tap away: every
         policy page's own footer lists all six. */
      /* Past the gate the rail carries About and Contact instead -- see App.tsx. */
      :root[data-app-ready] .site-legal { display: none; }

      @media (max-width: 640px) {
        .site-legal {
          top: calc(env(safe-area-inset-top, 0px) + 2px);
          bottom: auto;
          left: auto;
          right: 8px;
          justify-content: flex-end;
          gap: 0.6rem;
          font-size: 10px;
        }
        .site-legal a.secondary { display: none; }
      }
    </style>
  </body>
</html>
