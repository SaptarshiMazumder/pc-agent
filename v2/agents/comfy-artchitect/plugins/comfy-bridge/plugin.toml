# comfy-bridge — every call this agent makes to ComfyUI, which is Comfy Cloud (cloud.comfy.org).
#
# THE CREDENTIALS ARE NAMES. `[sandbox] secrets` lists what may ride along; the host substitutes
# each `${…}` at the last moment. This code cannot read any of their values, cannot keep one, and
# cannot post one to a host it was not granted.

id          = "comfy-bridge"
name        = "ComfyUI Bridge"
kind        = "native"
entry       = "comfy_bridge:register"
description = "Design ComfyUI workflows, check them against Comfy Cloud, run them there and bring the results back."

[sandbox]
# Comfy Cloud, and the platform's address as a NAME the host folds in (comfy_price reads the
# credit rate there).
net     = [
  "https://cloud.comfy.org", "${AGENTD_ACCOUNTS_URL}",
  # SEEDREAM 5 PRO, the agent's own image making (image_generation/): Higgsfield's developer API,
  # its upload bucket, result CDNs and Clerk for the token refresh; then fal's queue and media
  # hosts, the fallback.
  "fnf-api-gw.higgsfield.ai", "upload.higgsfield.ai", "cdn.higgsfield.ai", "*.cloudfront.net", "clerk.higgsfield.ai",
  "queue.fal.run", "fal.run", "*.fal.media", "fal.media",
]
# USER_COMFY_API_KEY: the person's Comfy key — every Comfy Cloud call carries it (X-API-Key), and a
# paid partner node in a run is paid with it. HF_TOKEN / CIVITAI_TOKEN: comfy_research reads a gated
# model page with the platform's token, only ever on that site's own host.
# USER_CIVITAI_TOKEN: the person's Civitai key — only ever inside a civitai.com download link.
# FAL_KEY / HIGGSFIELD_*: the PLATFORM's provider keys (the machine's global Settings, as for Ad
# Studio) — Seedream images are paid with them and charged to the person in platform credits
# (AGENTD_PLATFORM_TOKEN reads the balance and posts the debit; see image_generation/).
secrets = ["HF_TOKEN", "CIVITAI_TOKEN", "USER_COMFY_API_KEY", "USER_CIVITAI_TOKEN",
           "FAL_KEY", "HIGGSFIELD_ACCESS_TOKEN", "HIGGSFIELD_REFRESH_TOKEN", "AGENTD_PLATFORM_TOKEN"]
# WHAT ITS TOOLS READ FROM THE WORKSPACE — and so what a microVM is shipped per call. The
# workspace is the account's: every chat's reference photos and every render ever downloaded
# live in it, and shipping all of it (140 MB, four calls at once) is what OOM-killed the hosted
# daemon. These tools read the job's gate records and THIS chat's three folders (chat_paths),
# nothing else — a reference upload's bytes are read on the HOST by the fetch broker, and a
# download is written there too.
# THE LIBRARY'S TEXT PARTS TRAVEL, ITS MEDIA DOES NOT. The catalogue, the saved workflows and
# the uploaded files are what library_find/read/use read; a saved face or product video is
# never opened by the agent (it sees no pixels), so it stays on the daemon and the WINDOW copies
# it into a slot on library_use's instruction (details.copy). Shipping library/references here
# would put every kept render on every node search.
workspace = [
  ".studio", "workflows/{session}", "references/{session}", "outputs/{session}",
  "library/index.json",
  "library/uploaded/workflows", "library/saved/workflows",
  "library/uploaded/files", "library/saved/files",
  "library/uploaded/templates", "library/saved/templates", "library/suggested/templates",
]
