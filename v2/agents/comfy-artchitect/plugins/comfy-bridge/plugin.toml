# comfy-bridge — every call this agent makes to a ComfyUI instance.
#
# THE HOST IS A FILE, NOT A SETTING. It used to be `${COMFYUI_URL}`, filled in by whoever ran the
# agent. The instance is now PROVISIONED — vast-bridge rents one per user and writes its address
# to .studio/connection.json — so this plugin reads that file and reaches whatever it names. A
# fixed allowlist could never have expressed it either way: the address is a rented box that did
# not exist when this file was written.
#
# WHICH IS WHY `net` IS EMPTY. There is no placeholder host left to declare.
#
# THE RESEARCH CREDENTIALS ARE STILL NAMES. `[sandbox] secrets` lists what may ride along; the
# host substitutes each `${…}` at the last moment. This code cannot read any of their values,
# cannot keep one, and cannot post one to a host it was not granted.

id          = "comfy-bridge"
name        = "ComfyUI Bridge"
kind        = "native"
entry       = "comfy_bridge:register"
description = "Probe a ComfyUI instance, read what it has installed, research what a model needs, emit workflows, submit them and report what came back."

[sandbox]
# The instance address is no longer a setting — it arrives in .studio/connection.json from
# vast-bridge (or comfy_connect), so there is no ${…} host to declare here any more.
net     = []
# COMFY_API_KEY rides in the /prompt BODY (extra_data.api_key_comfy_org) rather than a
# header — the host substitutes it there now, so this plugin names it and never holds it.
# AGENTD_ACCOUNTS_INTERNAL_KEY authorises the credit gate and the debit in comfy_run. It has
# to be DECLARED even though the value never arrives here: the broker refuses a ${NAME} a
# plugin did not list, so an undeclared one fails as "undeclared secret" rather than as the
# 401 you would expect, which reads like a credential problem and is not one.
secrets = ["HF_TOKEN", "CIVITAI_TOKEN", "COMFY_API_KEY", "AGENTD_ACCOUNTS_INTERNAL_KEY"]
