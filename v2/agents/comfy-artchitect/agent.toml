# Comfy Penguin 窶・builds ComfyUI workflows, runs them on YOUR instance, iterates with you.
#
# WHERE COMFYUI RUNS: COMFY CLOUD. Every workflow runs on Comfy Cloud (cloud.comfy.org) with the
# person's own Comfy API key and plan — serverless, billed per GPU second, nothing to rent, start
# or stop. What it knows about MODELS comes from its knowledge base
# (plugins/comfy-bridge/knowledge_base: every family's files, recipes and rules, each fact sourced);
# what Comfy Cloud has is read from Comfy Cloud. An agent that recites what it saw during training
# writes workflows for last year's models.
#
# NO SHELL, ON PURPOSE. Everything happens over ComfyUI's HTTP API, so this agent is
# web-deliverable 窶・`exec` would refuse itself on a hosted daemon and would force
# `requires_local`. Comfy Cloud runs only its preinstalled node packs; a design that needs
# another one is changed, never worked around.

name = "Comfy Penguin"
version = "1.77.0"
# No project manager: this agent's own ask_user card already holds the user's approval, and its
# own rules stop its loops. The manager's plan points in that card read as a second approval.
managed = false
description = "An AI image and video studio: describe what you want and it picks the best model, sets it up on a cloud GPU, renders it, fixes whatever breaks, and hands you a reusable workflow to run again in one click or in your own ComfyUI."
tagline = "describe · render · keep the workflow"
color = "#7C5CFF"
suggestions = [
  "Turn a photo of my product into a 6-second vertical ad video",
  "Put my model in four different outfits, same face",
  "Make my last workflow faster without changing the look",
]

[app]
title = "Comfy Penguin"
mode = "window"
entry = "ui/index.html"
public = false

# WEB IS NOT AN AFTERTHOUGHT HERE. An agent that can only run on the machine beside the GPU is
# useless to the person whose GPU is rented, which is most of them 窶・so this agent was built to
# earn the flag rather than to ask for it: no `exec`, no local paths, every ComfyUI call over
# HTTP through the host's broker. The instance is reached by URL, so "where the browser is" and
# "where ComfyUI is" are allowed to be different places.
[delivery]
web = true

# The shared tools it may reach. Deliberately short 窶・and NO FILE TOOLS. Every file this agent
# has business with goes through a comfy_* tool: pipeline_plan and the stage tools write workflows,
# comfy_upload sends references, comfy_download brings renders back. With read/ls/find it opened other jobs' stale
# drafts and anchored on them; with write it hand-wrote a "plan.md" in place of a workflow. Its
# skill is always loaded, so there is nothing left it needs to read.
#   web_search/web_fetch      research a model or node it has not met 窶・Civitai, HF, docs
#   update_plan               the build is multi-step and the user watches it
#   verify_answer             catches "I made a workflow" when it only described one
#   show_files                its output is files; it should be able to show them
# NO exec/process: see the header. Its own tools (comfy_*) are implicitly allowed and must never
# be listed here.
[tools]
allow = [
  "web_search", "web_fetch",
  "update_plan", "verify_answer", "show_files",
  "ask_user",
]

# NO [tools.fs] write_roots, and that is deliberate 窶・it is the one declaration that would break
# this agent on the web.
#
# `<agent_dir>` is the agent's DEFINITION folder. On a desktop the workspace sits inside it
# (`agents/<id>/workspace/`), so fencing writes to `<agent_dir>` reads as "its own folder" and
# works. On a hosted daemon the definition is the SHARED catalogue 窶・one copy for every account 窶・# while the workspace is per account, under `accounts/<acct>/agents/<id>/workspace/`. The
# workspace is then NOT inside `<agent_dir>`, so that fence refuses the agent's own files and
# `write`/`edit` fail for everyone on the web while working perfectly for the author on desktop.
#
# Declaring nothing is what every non-builder agent does, and it is not "unfenced": the hosted
# tenant clamp already confines every write to the caller's own slice, whatever the agent asked
# for. Only the two builders declare roots, because they legitimately write into OTHER agents.

# THE PERSON'S COMFY API KEY runs everything: every call to Comfy Cloud carries it (as a name the
# host substitutes — the plugin never holds the value). Unset or on a plan without API access, the
# first call that needs Comfy Cloud says so in Comfy Cloud's words.

[[settings]]
key      = "USER_COMFY_API_KEY"
label    = "Your Comfy API key"
kind     = "secret"
required = false
help     = "Runs every workflow on Comfy Cloud with your Comfy plan (Standard or above; importing models needs Creator). Get it at platform.comfy.org → API keys."

# THE PERSON'S CIVITAI KEY, optional: many Civitai files (most LoRAs) download only with a login. It
# goes into the civitai.com download link Comfy Cloud imports from, as a name the host substitutes.

[[settings]]
key      = "USER_CIVITAI_TOKEN"
label    = "Your Civitai API key"
kind     = "secret"
required = false
help     = "Lets Comfy Penguin import Civitai models and LoRAs that need a login. Civitai → Account settings → API keys."
