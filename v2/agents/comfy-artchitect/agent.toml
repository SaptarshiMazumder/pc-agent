# Comfy Artchitect — builds ComfyUI workflows, runs them on YOUR instance, iterates with you.
#
# WHERE COMFYUI RUNS IS THE USER'S BUSINESS. A workstation on localhost, a rented GPU on vast or
# RunPod, a Modal endpoint — the agent is told a URL and a credential and works against whatever
# is there. That is why every ComfyUI fact this agent has is READ FROM THE INSTANCE rather than
# remembered: the model list, the node list, the sampler names. An agent that recites the
# checkpoints it saw during training writes workflows that fail on the box in front of it.
#
# NO SHELL, ON PURPOSE. Everything happens over ComfyUI's HTTP API, so this agent is
# web-deliverable — `exec` would refuse itself on a hosted daemon and would force
# `requires_local`. The cost is that installing a missing custom node depends on ComfyUI-Manager
# being present and permitting it; the agent reports precisely when it is not, rather than
# pretending it can fix it.

name = "Comfy Artchitect"
version = "1.42.0"
description = "Designs, runs and iterates ComfyUI workflows against your own instance: reads what is actually installed, builds the graph, submits it, repairs what the server rejects, and hands back importable workflow files."
tagline = "design · run · repair · iterate"
color = "#7C5CFF"
suggestions = [
  "Build a text-to-image workflow using what my instance already has",
  "Connect to my ComfyUI and tell me what models are installed",
  "Make my last workflow faster without changing the look",
]

[app]
title = "Comfy Artchitect"
mode = "window"
entry = "ui/index.html"
public = false

# WEB IS NOT AN AFTERTHOUGHT HERE. An agent that can only run on the machine beside the GPU is
# useless to the person whose GPU is rented, which is most of them — so this agent was built to
# earn the flag rather than to ask for it: no `exec`, no local paths, every ComfyUI call over
# HTTP through the host's broker. The instance is reached by URL, so "where the browser is" and
# "where ComfyUI is" are allowed to be different places.
[delivery]
web = true

# The shared tools it may reach. Deliberately short:
#   read/write/edit/ls/find   author workflow JSON in its own workspace
#   web_search/web_fetch      research a model or node it has not met — Civitai, HF, docs
#   update_plan               the build is multi-step and the user watches it
#   verify_answer             catches "I made a workflow" when it only described one
#   show_files                its output is files; it should be able to show them
# NO exec/process: see the header. Its own tools (comfy_*) are implicitly allowed and must never
# be listed here.
[tools]
allow = [
  "read", "write", "edit", "ls", "find",
  "web_search", "web_fetch",
  "update_plan", "verify_answer", "show_files",
]

# NO [tools.fs] write_roots, and that is deliberate — it is the one declaration that would break
# this agent on the web.
#
# `<agent_dir>` is the agent's DEFINITION folder. On a desktop the workspace sits inside it
# (`agents/<id>/workspace/`), so fencing writes to `<agent_dir>` reads as "its own folder" and
# works. On a hosted daemon the definition is the SHARED catalogue — one copy for every account —
# while the workspace is per account, under `accounts/<acct>/agents/<id>/workspace/`. The
# workspace is then NOT inside `<agent_dir>`, so that fence refuses the agent's own files and
# `write`/`edit` fail for everyone on the web while working perfectly for the author on desktop.
#
# Declaring nothing is what every non-builder agent does, and it is not "unfenced": the hosted
# tenant clamp already confines every write to the caller's own slice, whatever the agent asked
# for. Only the two builders declare roots, because they legitimately write into OTHER agents.

# NO URL, NO CREDENTIAL, NOTHING TO FILL IN. The instance is PROVISIONED for this user by the
# platform (plugins/vast-bridge → the accounts service), and its address is handed to the comfy
# tools through .studio/connection.json. Asking someone to rent a GPU, find its URL and paste it
# was the friction this agent exists to remove, and a setting nobody should ever need to touch is
# worse than no setting: it invites a stale value that silently shadows the real instance.
#
# `comfy_connect` remains as the escape hatch for someone who DOES have their own box — it writes
# the same file from a URL pasted in chat, so the mechanism is one, not two.

# RESEARCH CREDENTIALS, both optional. `comfy_research` reads model cards and reference
# workflows from Hugging Face and Civitai; public models need no token. A gated model
# (FLUX.1-dev, SD3.5) hides its files until the account that accepted its license presents a
# token — so without this field those models simply report "gated", which is true but unhelpful.
# NOTHING FOR THE USER TO FILL IN — this agent has no settings at all, and that is the point.
#
# It used to ask for a ComfyUI URL, auth headers, provider API keys, a Hugging Face token and a
# Civitai token. Every one of those was the user doing a job the platform can do:
#
#   * the INSTANCE is rented on demand (plugins/vast-bridge) and its address handed straight to
#     the comfy tools, so there is no URL and no credential to type
#   * PAID MODELS are ComfyUI partner nodes authenticated by one platform-held account key, so
#     there is no per-provider key to collect
#   * HF_TOKEN / CIVITAI_TOKEN are deliberately NOT DECLARED HERE. A declared name resolves per
#     ACCOUNT, which is exactly what put the burden on the user; an undeclared one falls through
#     to the daemon's own environment, where the platform's tokens live. comfy-bridge still names
#     them under [sandbox] secrets, so the host substitutes them into gated Hugging Face and
#     Civitai requests and the plugin never handles a value.
#
# The two optional MCP servers went with them: instance-mcp pointed at a user's own box, and
# comfy-cloud at comfy.org's GPUs. Both answered "the user has to bring their own compute",
# which is no longer a question anyone asks here.
#
# The rule this enforces lives in AGENTS.md: never ask the user for an API key, for anything.

