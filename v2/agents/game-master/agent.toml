# game-master — a demo agent that ships its OWN two tools (agent-private plugin), used to
# exercise the plugin-sandbox seam: roll_dice (no LLM) + narrate_scene (needs an LLM call).

name = "Game Master"
description = "A playful tabletop RPG referee: rolls dice, looks up monsters, and narrates scenes."
version = "0.3.1" # 0.3.0 was unlisted; installs supersede BY VERSION, so a republish needs a new one
tagline = "roll · look up · narrate"
color = "#B5453C"
suggestions = [
  "Roll 4d6 and drop the lowest",
  "Look up the owlbear",
  "Narrate our party entering a flooded crypt",
]

# Its own window. This agent is the SANDBOX TEST RIG: its three private tools cover all three
# capability paths a marketplace agent can need — pure compute, a host-brokered MODEL call, and a
# host-brokered NETWORK call — so opening this app after installing the agent from a package
# exercises the whole untrusted-plugin surface by hand, in one place.
[app]
title = "Game Master"
mode = "window"
entry = "ui/index.html"
public = false

# How this agent REACHES people. Both keys are the defaults, spelled out because the choice is a
# product decision and an absent table reads as "nobody decided" — the same reason bedtime-kids
# states its own (the opposite) pair. exe: the marketplace also carries a small per-agent installer,
# so a stranger with no agentd downloads one file and has this app. web: OFF — running it on the
# hosted platform would put its three private tools on shared infrastructure, and this agent exists
# precisely to exercise the untrusted-plugin sandbox, which is not something to prove in production.
[delivery]
exe = true
web = false

# Tight scope: this agent needs nothing from the shared catalog. Its OWN tools (roll_dice,
# narrate_scene — shipped in plugins/game-kit) are implicitly allowed and never named here.
# report_outcome is the one shared tool a scheduled run uses to declare done/blocked/failed.
[tools]
allow = ["report_outcome"]

# The AGENT AUTHOR's say over which model its own tool calls. narrate_scene declares
# default_model = "" (inherit the brain), and the brain is whatever the operator configured —
# so without this line the narration rides on the house model and the house's spend caps.
# This is the right home for the choice: the model belongs to how THIS agent uses the tool,
# not to the tool's identity (plugin.toml), and not to the whole machine (agentd.config.json).
# resolve_tool_model layers it ABOVE global config, so it wins without touching anything global.
#
# The sandbox follows automatically: CapabilityGrant.models is derived from this same chain, so
# the child is granted exactly what it will ask for — no separate allowlist to keep in sync.
[plugins.game-kit.tools.narrate_scene]
model = "deepseek/deepseek-v4-pro"
