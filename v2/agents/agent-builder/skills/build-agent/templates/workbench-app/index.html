<!doctype html>
<!-- A WORKBENCH, not a chat window.

     The shape for an agent that INGESTS A PILE OF THINGS: drop the files in, watch each one go
     through, see which failed and why. Describing forty files in a chat box is not a worse
     version of this — it is a different, much slower job the user should never have to do.

     Every item carries its own state, and one failure does not stop the rest. See queue.js. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CHANGE ME: this is the window title. -->
  <title>Workbench</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">
          <!-- CHANGE ME: mark + name. -->
          <span class="mark" id="brandMark">◆</span>
          <span class="brand-name" id="brandName">Workbench</span>
        </div>
        <button class="icon-btn" id="railToggle" title="Collapse sidebar">‹</button>
      </div>


      <!-- chat.js drives this: it resets the Ask conversation. The board is the default view,
           but the button has to EXIST or chat.js dereferences null at boot and takes every
           control on the page down with it. -->
      <button class="new-btn" id="newChat"><span class="plus">+</span> New chat</button>
      <nav class="rail-nav">
        <button class="nav-item active" data-view="board"><span class="ico">▤</span>Queue</button>
        <button class="nav-item" data-view="chat"><span class="ico">✦</span>Ask</button>
        <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>
      </nav>

      <div class="rail-foot">
        <span class="status" id="status">connecting…</span>
        <span class="ver" id="daemonVer"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumbs">
          <span class="crumb-root" id="crumbRoot">Queue</span>
          <span class="stamp" id="stamp"></span>
        </div>
        <div class="topbar-actions">
          
          <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
        </div>
      </header>

      <!-- QUEUE -->
      <section class="view" id="view-board">
        <div class="board-scroll">
          <div class="board-inner">
            <!-- CHANGE ME: say what this agent accepts, in the words of whoever drops it. -->
            <div class="drop" id="drop">
              <span class="drop-title">Drop files here</span>
              <span class="drop-hint">or click to choose</span>
            </div>
            <input type="file" id="queuePicker" multiple hidden />

            <div class="queue-bar">
              <span class="queue-count" id="queueCount"></span>
              <span class="queue-actions">
                <button class="ghost-btn" id="queueClear">Clear finished</button>
                <button class="prime-btn" id="queueRun">Run</button>
              </span>
            </div>
            <ul class="queue" id="queueList"></ul>
            <p class="queue-msg" id="queueMsg"></p>
          </div>
        </div>
      </section>

      <!-- ASK — the same conversation the chat template ships, kept for the questions a
           number cannot answer. -->
      <section class="view" id="view-chat" hidden>
        <div class="thread" id="thread">
          <div class="hero" id="hero">
            <!-- CHANGE ME -->
            <h1>Ask about what you see</h1>
            <p>The numbers are above. Ask me why.</p>
            <div class="suggests" id="suggests"></div>
          </div>
        </div>
        <div class="composer-wrap">
          <div class="composer" id="composer">
            <div class="attachments" id="attachments" hidden></div>
            <textarea id="input" rows="1" placeholder="Ask a question…"></textarea>
            <div class="composer-foot">
              <button class="attach-btn" id="attach" title="Attach files">+</button>
              <span class="hint">Enter to send · Shift+Enter for a new line</span>
              <button class="send" id="send" title="Send">↑</button>
            </div>
            <input type="file" id="filePicker" multiple hidden />
          </div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden>
        <div class="settings-scroll">
          <div class="settings-inner" id="settingsBody">
            <div class="loading">loading settings…</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="vendor/agentd-client.js"></script>
  <script src="md.js"></script>
  <script src="chat.js"></script>
  <script src="settings.js"></script>
  <script src="queue.js"></script>
  <script src="app.js"></script>
</body>
</html>
