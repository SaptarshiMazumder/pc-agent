<!doctype html>
<!-- A DASHBOARD, not a chat window.

     The shape for an agent that runs on its own and reports: the numbers are on the screen when
     you open it, not something you have to ask for. Everything here is driven by
     `client.invokeTool` — direct tool calls, no model in the loop, no tokens spent — so Refresh
     is instant and can be honestly automatic.

     Keep the chat view. An agent worth a dashboard is usually also worth a question ("why is
     this number down?"), and the two belong in one window rather than two products. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CHANGE ME: this is the window title. -->
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">
          <!-- CHANGE ME: mark + name. -->
          <span class="mark" id="brandMark">◆</span>
          <span class="brand-name" id="brandName">Dashboard</span>
        </div>
        <button class="icon-btn" id="railToggle" title="Collapse sidebar">‹</button>
      </div>


      <!-- chat.js drives this: it resets the Ask conversation. The board is the default view,
           but the button has to EXIST or chat.js dereferences null at boot and takes every
           control on the page down with it. -->
      <button class="new-btn" id="newChat"><span class="plus">+</span> New chat</button>
      <nav class="rail-nav">
        <button class="nav-item active" data-view="board"><span class="ico">▦</span>Overview</button>
        <button class="nav-item" data-view="chat"><span class="ico">✦</span>Ask</button>
        <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>
      </nav>

      <div class="rail-foot">
        <span class="status" id="status">connecting…</span>
        <span class="ver" id="daemonVer"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumbs">
          <span class="crumb-root" id="crumbRoot">Overview</span>
          <span class="stamp" id="stamp"></span>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="refresh">Refresh</button>
          <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
        </div>
      </header>

      <!-- OVERVIEW -->
      <section class="view" id="view-board">
        <div class="board-scroll">
          <div class="board-inner">
            <!-- Filled by app.js. An empty board with no explanation is the one state a
                 dashboard must never show. -->
            <div class="tiles" id="tiles"></div>
            <section class="panel">
              <h2 id="chartTitle">Trend</h2>
              <div class="chart-wrap" id="chartWrap"></div>
            </section>
            <section class="panel">
              <h2 id="tableTitle">Detail</h2>
              <div class="table-wrap"><table class="grid" id="grid"></table></div>
            </section>
            <p class="board-msg" id="boardMsg"></p>
          </div>
        </div>
      </section>

      <!-- ASK — the same conversation the chat template ships, kept for the questions a
           number cannot answer. -->
      <section class="view" id="view-chat" hidden>
        <div class="thread" id="thread">
          <div class="hero" id="hero">
            <!-- CHANGE ME -->
            <h1>Ask about what you see</h1>
            <p>The numbers are above. Ask me why.</p>
            <div class="suggests" id="suggests"></div>
          </div>
        </div>
        <div class="composer-wrap">
          <div class="composer" id="composer">
            <div class="attachments" id="attachments" hidden></div>
            <textarea id="input" rows="1" placeholder="Ask a question…"></textarea>
            <div class="composer-foot">
              <button class="attach-btn" id="attach" title="Attach files">+</button>
              <span class="hint">Enter to send · Shift+Enter for a new line</span>
              <button class="send" id="send" title="Send">↑</button>
            </div>
            <input type="file" id="filePicker" multiple hidden />
          </div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden>
        <div class="settings-scroll">
          <div class="settings-inner" id="settingsBody">
            <div class="loading">loading settings…</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="vendor/agentd-client.js"></script>
  <script src="md.js"></script>
  <script src="chat.js"></script>
  <script src="settings.js"></script>
  <script src="board.js"></script>
  <script src="app.js"></script>
</body>
</html>
