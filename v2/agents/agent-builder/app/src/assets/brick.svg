<!-- Agent Builder's mark. A brick: the thing you build with, one of many, identical to its
     neighbours and useless alone — which is roughly what this window makes.

     Drawn on the same 34x34 box agentd's logo occupies so the two brands sit at the same
     optical weight in the sidebar. The lime is the theme accent hardcoded, because an <img>
     cannot read a CSS custom property; if the palette ever moves, this moves with it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" fill="none">
  <rect x="2" y="6" width="30" height="22" rx="4.5" fill="#a3e635" />
  <!-- Mortar: two courses, offset by half a brick, cut out of the fill so the coursing reads
       at 17px as well as it does at 34. -->
  <g stroke="#182100" stroke-width="1.8" stroke-linecap="round" opacity=".9">
    <path d="M2 13.3h30M2 20.7h30" />
    <path d="M17 6v7.3M9.5 13.3v7.4M24.5 13.3v7.4M17 20.7V28" />
  </g>
</svg>
