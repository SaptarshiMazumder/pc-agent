<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Agent Builder</h1>
    </div>
    <div class="bar-right">
      <button id="refresh" class="ghost" title="re-read the agent roster">Refresh</button>
      <span id="status" class="status" title="connection to the agentd daemon">connecting…</span>
    </div>
  </header>

  <main class="workbench">
    <!-- LEFT: the roster -->
    <nav class="pane roster">
      <div class="pane-head">
        <h2>Agents</h2>
        <span id="count" class="muted"></span>
      </div>
      <ul id="agents" class="list"></ul>
    </nav>

    <!-- RIGHT: the selected agent -->
    <section class="pane detail">
      <div id="empty" class="empty">
        <p>Select an agent to validate or package it.</p>
        <p class="muted">
          Build a new one by chatting with Agent Builder, then come back here to check and ship it.
        </p>
      </div>

      <article id="agent" hidden>
        <div class="agent-head">
          <div>
            <h2 id="a-name">–</h2>
            <p id="a-sub" class="muted">–</p>
          </div>
          <div class="badges" id="a-badges"></div>
        </div>

        <dl class="facts" id="a-facts"></dl>

        <div class="actions">
          <button id="validate" class="ghost">Validate</button>
          <button id="package" class="primary">Package&nbsp;→&nbsp;.agentpkg</button>
        </div>

        <div class="out-head">
          <h3 id="out-title">Output</h3>
          <button id="clear" class="link" hidden>clear</button>
        </div>
        <pre id="out" class="out muted">Nothing run yet.</pre>
      </article>
    </section>
  </main>

  <script src="vendor/agentd-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
