# figure-creator — turns a subject (a concept explained in chat, a paper/PDF, a sketch, a reference
# image, or a flat figure to re-edit) into a publication-grade scientific figure. It picks an ART
# TEMPLATE from its style gallery (templates/*.toml — biorender-shaded, ghosted-anatomy,
# isometric-3d-stem, watercolor-atlas, flat-vector, …), renders TEXTLESS artwork with Nano Banana Pro
# (Gemini 3 Pro Image), then adds labels, leaders, arrows, and an illustrated flowchart (icon nodes,
# not plain boxes) as an EDITABLE vector layer. Exports fully-editable SVG / PPTX and vector PDF.
#
# Full access on purpose: NO `skills` allowlist and NO `[tools] allow`, so it sees EVERY skill and
# tool (including ones added later) with no edit here. Its playbooks are `create-scientific-figure`
# and `vectorize-figure`; its tools are the figures / figure-art / vision / vectorize / figexport
# plugins, plus read/write/render. Its art templates live in templates/ (data — add one and it's live).

name = "Figure Creator"
version = "1.1.1" # b5: SDK sign-in gate (b4's HTTP flow bound a daemon-global key that no longer exists)

# Its OWN app UI (ui/), served by the daemon at /apps/figure-creator/ and opened as its own
# window — no agentd shell. `mode = "window"` = a chromeless product window (the exe wraps this
# same page). NOT public: figure-creator's value is the chat/generation pipeline, which is never
# exposed tokenless — this app requires a real (signed-in) connection.
[app]
title = "Figure Creator"
mode = "window"

# Per-agent model overrides, decoupled from the global config (agent.toml ALWAYS wins over
# agentd.config.json — see application/tool_models.py). Every knob below lives on a TOOL, in the
# plugins -> tools -> <knob> shape. This is where figure-creator's whole "engine" is wired WITHOUT
# touching global config or agentd core.

# --- The image engine: Nano Banana Pro (Gemini 3 Pro Image) --------------------------------------
# THE decisive quality lever. Global config points generate_artwork at FLUX 1.1 Pro (a photoreal
# model that invents anatomy and can't render diagram-grade structure); figure-creator overrides
# that to Gemini 3 Pro Image — class-leading on legible text, factual/structured figures, 4K, and
# reference conditioning. `provider` picks the backend SDK, `model` the endpoint. Per-call args and
# the chosen art TEMPLATE (templates/*.toml -> provider/model) still win over these defaults.
[plugins.figure-art.tools.generate_artwork]
provider = "gemini"
model = "gemini/gemini-3-pro-image"
# The house DEFAULT art style: when the agent calls generate_artwork with a `subject` but names NO
# template (and writes no full custom prompt), fall back to this template — the clean shaded BioRender /
# Cell-journal look. So "when in doubt" ALWAYS lands on the right style, even if the routing skill never
# ran. An explicit `template=` or a full `prompt` still wins. (Agent-local on purpose: templates/ is
# discoverable only from this agent's workspace, so this default must NOT live in global config.)
default_template = "biorender-shaded"
# FOR NOW: cap every generation to ~1024px for cheap, fast iteration. This overrides each template's
# own resolution (2K). Delete this one line to restore full-res per-template output. (1K | 2K | 4K)
resolution = "1K"
# templates_dir = "templates"   # optional override; default discovery finds <agent>/templates

# --- Reading + verification (Gemini; restated here so the agent is self-describing) --------------
[plugins.vision.tools.read_labels_from_image]
model = "gemini/gemini-3.1-pro-preview"                 # reading drawn labels — Gemini is strongest here
[plugins.vision.tools.verify_figure]
model = "gemini/gemini-2.5-flash"                       # a cheap judge is enough for the gate
