<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:"
  />
  <title>Figure Creator</title>
  <!-- THE AGENTD SHELL'S OWN STYLESHEET, vendored verbatim by @agentd/canvas. This page is not
       styled to resemble the product; it is dressed by the product's stylesheet, so a restyle of
       the shell arrives here on the next `npm run build` in v2/clients/canvas. theme.css after it
       carries only what is Figure Creator's rather than agentd's — the accent and startup states.
       The shared sign-in card is bundled with the shell. -->
  <link rel="stylesheet" href="vendor/agentd-shell.css?v=1.3.5" />
  <link rel="stylesheet" href="theme.css?v=1.3.5" />
</head>
<body>
  <!-- Initial content remains readable even if a script fails to load. app.js replaces it with
       the shared sign-in card, workspace, or a specific retryable connection error. -->
  <div id="root" class="app-root">
    <main class="app-fatal" role="status">
      <h1>Figure Creator</h1>
      <p>Starting Figure Creator… If this stays here, reload the page.</p>
    </main>
  </div>
  <div id="app-status" class="app-status" role="alert" hidden></div>
  <noscript>Enable JavaScript to open Figure Creator.</noscript>

  <script src="vendor/agentd-client.js?v=1.3.5"></script>
  <script src="vendor/agentd-canvas.js?v=1.3.5"></script>
  <script src="app.js?v=1.3.5"></script>
</body>
</html>
