<!doctype html>
<html lang="en">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:"
  />
  <title>Figure Creator</title>
  <!-- THE AGENTD SHELL'S OWN STYLESHEET, vendored verbatim by @agentd/canvas. This page is not
       styled to resemble the product; it is dressed by the product's stylesheet, so a restyle of
       the shell arrives here on the next `npm run build` in v2/clients/canvas. theme.css after it
       carries only what is Figure Creator's rather than agentd's — the accent, and the tokens the
       sign-in gate reads. -->
  <link rel="stylesheet" href="vendor/agentd-shell.css?v=9" />
  <link rel="stylesheet" href="theme.css?v=9" />
</head>
<body>
  <!-- sign-in is the SDK's shared gate (agentd.mountSignInGate) and it is REQUIRED — see app.js.
       It injects its own overlay over this page; there is no form here to keep in sync. -->
  <div id="root" class="app-root"></div>

  <script src="vendor/agentd-client.js?v=9"></script>
  <script src="vendor/agentd-canvas.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
