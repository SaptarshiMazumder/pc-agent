# figure-creator as a MARKETPLACE BUNDLE (M4) — `agentd bundle pack agents/figure-creator`
# reads this for the bundle's identity + dependencies, so packing is one command with no
# flags. The agent definition itself (agent.toml, IDENTITY.md, skills/, templates/) is
# packed as-is; the five figure-domain plugins ship INSIDE the artifact (vendored) so a
# bare Core install gets everything it needs; core capabilities the wheel always carries
# are declared as builtin requirements (asserted at install, never shipped twice).

[bundle]
id = "figure-creator"
name = "Figure Creator"
version = "1.3.2" # b9: web delivery, required sign-in, shell surface, settings, real chat rows
description = "Publication-grade scientific figures: templated artwork (Nano Banana Pro), grounded labels/leaders as an editable vector overlay, SVG/PPTX/PDF export."
agentd_compat = ">=0.1,<1"
entitlement = ""            # free while we build; set a SKU (e.g. "figure-creator-pro") to license-gate
publisher = "agentd"
icon = "sparkles"           # store-card glyph (see the client's glyph registry)

# HOW THIS AGENT REACHES PEOPLE. `web` is opt-in and never inferred (domain/bundle.py:
# DeliveryModes) because a web agent runs on OUR infrastructure, not the buyer's machine —
# so silence has to mean no. Turning it on does two things: the hosted daemon serves this
# agent's ui/ at <web_host>/apps/figure-creator/, and the store renders "Open in browser"
# next to Download. Requires the [app] table in agent.toml, which packer.py asserts at pack
# time rather than letting a store advertise a door that opens onto nothing.
[bundle.delivery]
web = true
exe = true

[[bundle.plugins]]
id = "figures"
source = "vendored"

[[bundle.plugins]]
id = "figure-art"
source = "vendored"

[[bundle.plugins]]
id = "vision"
source = "vendored"

[[bundle.plugins]]
id = "vectorize"
source = "vendored"

[[bundle.plugins]]
id = "figexport"
source = "vendored"

[[bundle.plugins]]
id = "core_fs"
source = "builtin"

[[bundle.plugins]]
id = "html"
source = "builtin"
