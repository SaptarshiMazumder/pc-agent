<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet"></head><body><style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden}*{box-sizing:border-box}img{display:block}
body{background:#c8322a}
.offer{position:absolute;left:70px;top:70px;font:400 300px/.82 'Bebas Neue';color:#fff6e9;letter-spacing:.01em}
.offer small{display:block;font-size:120px;letter-spacing:.06em}
.frame{position:absolute;right:70px;top:430px;width:620px;height:720px;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.frame img{width:100%;height:100%;object-fit:cover}
.line{position:absolute;left:70px;top:720px;width:300px;font:600 34px/1.25 Montserrat;color:#fff6e9}
.cta{position:absolute;left:70px;top:1040px;padding:22px 40px;background:#fff6e9;color:#c8322a;border-radius:60px;font:800 30px Montserrat;letter-spacing:.06em}
.terms{position:absolute;left:70px;bottom:48px;font:500 20px Inter;color:#ffd9cf}
</style>
<div class="offer">{{30%}}<small>{{OFF}}</small></div>
<div class="frame"><img src="ASSET_1"></div>
<div class="line">{{what is on offer}}</div>
<div class="cta">{{SHOP NOW}}</div>
<div class="terms">{{terms}}</div></body></html>
