<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet"></head><body><style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden}*{box-sizing:border-box}img{display:block}
body{background:radial-gradient(120% 80% at 50% 38%,#fbf8f3 0%,#efe6da 60%,#e2d6c6 100%)}
.kicker{position:absolute;top:90px;width:100%;text-align:center;font:600 22px Inter;letter-spacing:.34em;color:#8a6f52}
.pic{position:absolute;left:190px;top:170px;width:700px;height:700px;border-radius:50%;overflow:hidden;box-shadow:0 40px 80px rgba(80,55,30,.25)}
.pic img{width:100%;height:100%;object-fit:cover}
.name{position:absolute;top:930px;width:100%;text-align:center;font:600 76px 'Playfair Display';color:#2a1f17}
.detail{position:absolute;top:1040px;left:140px;width:800px;text-align:center;font:400 30px/1.4 Inter;color:#5b4a3b}
.price{position:absolute;top:1170px;width:100%;text-align:center;font:600 28px Inter;color:#2a1f17;letter-spacing:.08em}
</style>
<div class="kicker">{{kicker}}</div>
<div class="pic"><img src="ASSET_1"></div>
<div class="name">{{product name}}</div>
<div class="detail">{{one line about its design}}</div>
<div class="price">{{price · store}}</div></body></html>
