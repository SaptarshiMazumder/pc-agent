<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet"></head><body><style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden}*{box-sizing:border-box}img{display:block}
body{background:#0f0d0c}
.glow{position:absolute;left:140px;top:430px;width:800px;height:800px;background:radial-gradient(circle,rgba(233,196,106,.32),transparent 65%)}
.kicker{position:absolute;top:96px;width:100%;text-align:center;font:600 22px Inter;letter-spacing:.42em;color:#e9c46a}
.title{position:absolute;top:150px;left:90px;width:900px;text-align:center;font:400 112px/1 'DM Serif Display';color:#f6efe4}
.title i{color:#e9c46a}
.frame{position:absolute;left:250px;top:480px;width:580px;height:700px;border-radius:300px 300px 24px 24px;overflow:hidden;border:2px solid rgba(233,196,106,.6)}
.frame img{width:100%;height:100%;object-fit:cover}
.foot{position:absolute;bottom:64px;width:100%;text-align:center;font:500 26px Inter;letter-spacing:.2em;color:#cdbfa8}
</style>
<div class="glow"></div>
<div class="kicker">{{NEW}}</div>
<div class="title">{{headline, one word in <i>italics</i>}}</div>
<div class="frame"><img src="ASSET_1"></div>
<div class="foot">{{date or call to action}}</div></body></html>
