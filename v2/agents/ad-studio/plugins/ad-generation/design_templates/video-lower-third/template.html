<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet"></head><body><style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden}*{box-sizing:border-box}img{display:block}
body{background:#111}
.video{position:absolute;inset:0}
.shade{position:absolute;left:0;bottom:0;width:1080px;height:560px;background:linear-gradient(transparent,rgba(0,0,0,.72));animation:fade 1s ease both}
.bar{position:absolute;left:72px;bottom:150px;padding-left:24px;border-left:4px solid #e9c46a;animation:slide .9s .4s cubic-bezier(.2,.8,.2,1) both}
.bar h1{margin:0;font:600 70px/1.05 'Playfair Display';color:#fff}
.bar p{margin:14px 0 0;font:400 28px Inter;color:#f1e9dc;letter-spacing:.04em}
@keyframes slide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<div class="video" data-video="VIDEO_1"></div>
<div class="shade" data-over></div>
<div class="bar" data-over><h1>{{headline}}</h1><p>{{a short line}}</p></div></body></html>
