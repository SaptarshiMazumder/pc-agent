<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bedtime Kids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="shell">
    <!-- ============ history sidebar ============ -->
    <aside id="sidebar">
      <div id="brand">
        <span id="brandDot">🌙</span>
        <span>Bedtime Kids</span>
      </div>
      <button id="newChat" type="button">+ New story</button>
      <div id="histTitle">Past stories</div>
      <ul id="sessionList"></ul>
    </aside>

    <!-- ============ main pane ============ -->
    <main id="main">
      <header id="topbar">
        <span id="status" class="status"><span id="statusDot"></span><span id="statusText">starting…</span></span>
      </header>

      <section id="log">
        <div id="welcome">
          <h1>What should tonight's story be about?</h1>
          <p>Pick a theme — an animal, a place, a toy — and I'll tell a gentle story that winds down to sleep.</p>
          <ul id="chips"></ul>
        </div>
      </section>

      <form id="composer" autocomplete="off">
        <textarea id="prompt" rows="1" placeholder="Tonight's theme…"></textarea>
        <button id="send" type="submit">Tell it</button>
      </form>
    </main>
  </div>

  <script src="vendor/agentd-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
