# Cloud Agent Builder ("cabbie") — Agent Builder's sister for the web.
#
# The web authoring surface shares Agent Builder's tool implementation. User code
# is compiled, imported and executed in disposable tasks; definition changes on
# the controller remain subject to the caller's account/org authorization.
#
# NO `requires_local`. This agent is FOR the hosted daemon, so it is offered there. On a desktop
# daemon it also appears, a fenced builder beside the full one — harmless, and useful for testing
# the exact web surface locally.
#
# SHARED CODE, NOT COPIED. Its authoring tools are agent-builder's `agent_authoring` package,
# imported (see plugins/cloud-agent-authoring/) — one source of truth. The DIFFERENCE between the
# two agents is this file: which of those tools each one is allowed to call.

name = "Cloud Agent Builder"
version = "1.2.3"
description = "Builds cloud agents from chat: their agent.toml, identity, skills, and app UI — web-deliverable by construction. The fenced, hosted sister of Agent Builder."
tagline = "build · validate · ship — on the web"
color = "#0EA5A0"
suggestions = [
  "Build me an agent that watches a webhook and summarises it",
  "Make an agent that answers questions from a public API",
  "Validate every agent I have",
]

# Its own window, opened in a browser tab on the hosted daemon — the whole point is to feel the
# real web experience. `public = false`: this surface authors agents, so it must never admit a
# tokenless visitor. The static UI still serves (that gate is separate); the WebSocket it opens
# requires a signed-in session.
[app]
title = "Cloud Agent Builder"
mode = "window"
entry = "ui/index.html"
public = false
# A SURFACE OF THE PRODUCT, not one of your agents. Clients give this app its own entry
# in their navigation and keep it out of agent lists and shelves — building agents is a
# feature of agentd, not an agent you picked. Remove this line and it lists like any other.
standalone = true
# ONE DESTINATION, TWO IMPLEMENTATIONS. Agent Builder and Cloud Agent Builder both provide
# this surface — the desktop one where you own the machine, the fenced one where you own an
# account on someone else's. Naming the same surface makes clients draw a SINGLE
# "Agent Builder" entry and open whichever implementation suits the host they run on.
surface = "agent-builder"

# WHERE IT MAY WRITE — same self-protection agent-builder uses. Its job is authoring OTHER agents,
# so it writes into the agents root; on a hosted daemon the tenant fence further clamps that to the
# caller's OWN account subtree, so "the agents root" means "this account's agents". Its own
# definition is denied: an agent that could rewrite its own agent.toml could widen its own rules.
[tools.fs]
write_roots = ["<agents_dir>"]
deny        = ["<agent_dir>"]

# NO MCP WORKSHOP on the web. `add_mcp` lets the model connect an arbitrary MCP server from chat
# text, and on a hosted surface that text can arrive from anywhere — a bad default when the process
# is shared. Cabbie still WRITES [[mcp]] blocks into the agents it builds; it just does not spin up
# arbitrary servers live in the shared daemon. (agent-builder keeps the workshop; it is local.)
[capabilities]
mcp_workshop = false

# Authoring uses the same tenant fences as every other hosted agent. Private
# Python, shell commands, browser sessions and MCP run in disposable tasks;
# compile/import never executes user code inside the shared daemon.
# Desktop packaging and public publishing remain separate product workflows.
[tools]
allow = [
  "read", "write", "edit", "ls", "find", "grep",
  "exec", "process",
  "skill_workshop", "update_plan", "verify_answer", "show_files",
  "web_search", "web_fetch",
  "spawn_subagent",
  # E2E — the whole write-check-fix loop on the web: e2e_run drives a scenario IN-PROCESS
  # through the gateway's own dispatch as the caller's account (same tenancy, same metering,
  # no socket), so cabbie tests what it builds.
  "e2e_run", "e2e_replay", "e2e_checks",
]
deny = [
  "package_agent",
  "publish_agent",
]
