# app-demo — the reference APP AGENT: same definition format as every agent, plus [app] + ui/.
# The daemon serves ui/ at /apps/app-demo/ (same origin as the WS gateway — docs/PROTOCOL.md §9);
# open it with `agentd app open app-demo`. The UI is vanilla JS on @agentd/client — NO build step —
# and only ever INVOKES the backend over the published protocol: it is the living example that an
# agent app can be rich and independent without extending the core in any way.

name = "App Demo"
description = "Reference agent app: ships its own browser UI that speaks the published protocol — chat, direct tool invocation, artifacts. The template for building app agents."
tagline = "reference agent app"
version = "1"

[app]
title = "App Demo Console"

[tools]
# a deliberately small, read-only surface — the demo shows the APP rails, not tool power
allow = ["ls", "read", "find"]
