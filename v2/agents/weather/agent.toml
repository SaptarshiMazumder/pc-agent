# weather — Tokyo weather briefings: a daily 8am email forecast + a live dashboard app.

name = "Weather"
description = "Tokyo weather: daily 8am forecast briefing by email and a live current-conditions dashboard."
version = "0.1.0"

# Its own UI (ui/), served by the daemon at /apps/weather/ — opens in its OWN window
# (a desktop-independent app; the exe later just wraps this same page).
[app]
title = "Tokyo Weather"
mode = "window"

# Tight scope: this agent needs almost nothing from the shared catalog. Its OWN tools
# (get_weather, send_email — shipped in plugins/weather-kit) are implicitly allowed and
# never need naming here. report_outcome is the one shared tool scheduled runs use to
# declare done/blocked/failed.
[tools]
allow = ["report_outcome"]
