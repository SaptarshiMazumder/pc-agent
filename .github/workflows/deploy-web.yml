# Web (hosted) deploy: build the agentd Docker image, push to ECR, optionally roll the
# demo EC2 host via SSM. Manual by design — the hosted demo redeploys when YOU say so,
# never as a side effect of a push.
#
# Repo secrets required (see v2/deploy/aws/README.md):
#   AWS_DEPLOY_ROLE_ARN  — an OIDC-trusted role with ECR push + ssm:SendCommand
#   AWS_REGION           — e.g. ap-northeast-1
#   ECR_REPOSITORY_URL   — terraform output ecr_repository_url
#   EC2_INSTANCE_ID      — terraform output instance_id (only needed when deploying)

name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also roll the EC2 host after pushing (SSM agentd-deploy)"
        type: boolean
        default: true

permissions:
  id-token: write # OIDC to AWS — no long-lived keys in secrets
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: v2
        run: |
          IMAGE="${{ secrets.ECR_REPOSITORY_URL }}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" -f deploy/docker/Dockerfile .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    needs: build-push
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Roll the demo host (SSM)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/usr/local/bin/agentd-deploy"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '{status: Status, out: StandardOutputContent}' --output text
