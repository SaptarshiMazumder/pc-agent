# Stage 3/4 - Release. Fires ONLY when you push a version tag (vX.Y.Z).
# The 5-step assembly line: version-check -> wheel -> installers -> publish.
# See v2/planning/platform/ci-cd-plan.md (Phase 4).
name: Release

on:
  push:
    tags: ["v*"] # e.g. v0.1.0  (stamp main, push the tag, this runs)

permissions:
  contents: write # the publish job creates a GitHub Release + uploads assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  # [2] SAFETY GATE: the tag must match the version in BOTH files, or we build nothing.
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match agent_runtime/__init__.py and package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"                                          # v1.2.3 -> 1.2.3
          PYVER=$(grep '__version__' agent_runtime/__init__.py | head -1 | cut -d'"' -f2)
          NPMVER=$(grep '"version"' clients/desktop/package.json | head -1 | cut -d'"' -f4)
          echo "tag=$TAG  agentd=$PYVER  package.json=$NPMVER"
          if [ "$TAG" != "$PYVER" ] || [ "$TAG" != "$NPMVER" ]; then
            echo "::error::Version mismatch - tag v$TAG but agentd=$PYVER, package.json=$NPMVER. Bump BOTH files to $TAG, commit to main, then re-tag."
            exit 1
          fi

  # [3] Build the pure-Python wheel (works on any OS). Runs your hatch hook.
  wheel:
    name: Build wheel
    needs: version-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/clients/sdk-js/package-lock.json
      # EVERY AGENT APP LOADS THIS FILE, and `clients/sdk-js/dist/` is gitignored — so a fresh
      # checkout has no build of it and scripts/hatch_build.py silently omits
      # `_data/sdk/agentd-client.js` from the wheel. That wheel is what the embedded runtime
      # installs, so the shipped engine ends up with no canonical SDK and two things quietly stop
      # working inside every installed copy: pack-time re-vendoring, and the serve-time
      # substitution that keeps agents a user CREATED on their own machine current
      # (gateway._app_asset_bytes). Both looked correct in the repo and did nothing in the product.
      - name: Build the agent-app SDK (staged into the wheel)
        working-directory: v2/clients/sdk-js
        run: |
          npm ci --no-audit --no-fund
          npx tsup
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist
      # LOUD, because the failure this guards is silent by nature: the hatch hook stages the SDK
      # only `if sdk.is_file()`, so a missing build ships a working-looking wheel that has quietly
      # dropped it. A release is the last place that should be discovered from a user's bug report.
      - name: The wheel must carry the agent-app SDK
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/agentd-*.whl"))[0]
          want = "agent_runtime/_data/sdk/agentd-client.js"
          names = zipfile.ZipFile(whl).namelist()
          if want not in names:
              sys.exit(f"{whl} is missing {want} — the SDK build step did not run or produced nothing")
          print(f"ok: {whl} carries {want}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: v2/dist/*.whl

  # [4] Build the Windows installers (core + studio). Reuses the wheel from [3].
  installers:
    name: Build installers (Windows)
    needs: wheel
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/clients/package-lock.json
      - name: Download the wheel from the wheel job
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: v2/dist
      - name: Assemble the embedded runtime (CPython + wheel)
        run: |
          $wheel = (Get-ChildItem ../../dist -Filter "agentd-*.whl" | Select-Object -First 1).FullName
          Write-Host "using wheel: $wheel"
          powershell -File scripts/build-runtime.ps1 -Wheel $wheel
      - name: Install client deps
        # the workspace ROOT owns the lockfile; electron-builder resolves the hoisted
        # node_modules from clients/ when it runs in desktop/ below
        run: npm ci
        working-directory: v2/clients
      # AN INSTALLER BAKES ITS PLATFORM ADDRESS AND CANNOT BE CORRECTED AFTERWARDS. Whatever
      # `platform_url` is committed in the flavor is what every downloader of this .exe will
      # talk to, forever. A flavor that declares a hosted platform but no platform_url falls back
      # to the per-service URLs, which is precisely the pre-discovery arrangement that rotted on
      # every ALB recreate. Cheap, credential-free guard; the STALE case is caught by running
      # `npm run sync:urls` before tagging (see v2/deploy/GO-LIVE.md).
      - name: Flavors must declare platform_url
        shell: bash
        working-directory: v2/clients/desktop/flavors
        run: |
          fail=0
          for f in */distribution.toml; do
            grep -q '^\[platform\]' "$f" || continue
            if ! grep -q '^platform_url[[:space:]]*=' "$f"; then
              echo "::error file=$f::[platform] present but platform_url missing - this installer would bake stale per-service URLs"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "all flavors declare platform_url"
          exit $fail

      - name: Build core + studio installers
        run: |
          npm run dist:core
          npm run dist:studio
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            v2/clients/desktop/dist/core/*.exe
            v2/clients/desktop/dist/studio/*.exe

  # [5] Publish the GitHub Release with the wheel + installers attached.
  publish:
    name: Publish release
    needs: [wheel, installers]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # idempotent: create the release only if it doesn't already exist (safe to re-run)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "agentd $TAG" --generate-notes
          fi
          # upload every wheel + exe; -print0/-0 handles the spaces in installer filenames
          find artifacts \( -name '*.whl' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
