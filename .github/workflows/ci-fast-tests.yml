# Stage 1 - Validate. Runs on every push / PR to develop or main.
# This mirrors `v2/scripts/verify.ps1` exactly: if verify.ps1 is green locally, this goes green too.
name: CI fast tests

on:
  push:
    branches: [develop, main]
    paths: ["v2/**", ".github/workflows/ci-fast-tests.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["v2/**", ".github/workflows/ci-fast-tests.yml"]

# Cancel an in-progress run when a newer commit lands on the same branch/PR (saves minutes).
concurrency:
  group: ci-fast-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python (agentd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2 # conftest.py builds sys.path from here; pytest MUST run in v2/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            v2/pyproject.toml
            v2/monitoring/pyproject.toml

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      # The shared telemetry library is its OWN distribution (v2/monitoring), not an extra of
      # agentd — it is pip-installed into three of the four images and must stay dependency-free,
      # which is why it is packaged separately. CI has to install it explicitly: every import
      # site has an optional-import no-op fallback, so without this the suite would silently
      # test the fallbacks instead of the real thing, and tests that import it outright fail
      # to collect.
      - name: Install telemetry library (v2/monitoring)
        run: pip install -e monitoring

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Architecture contracts (import-linter)
        run: lint-imports
        continue-on-error: true

      - name: Types (mypy) - informational, not blocking
        run: mypy
        continue-on-error: true # burn the 156 errors down, then delete this line to make it a gate

      - name: Unit tests (pytest)
        run: pytest tests/unit -q

      - name: Integration tests (pytest)
        run: pytest tests/integration -m "not live and not browser and not computer" -q

      # tests/e2e (booted-daemon smoke) is intentionally NOT run here yet — it gets its
      # own job (non-blocking at first) once the first daemon smoke test lands.

  model-proxy:
    name: Python (model-proxy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/model_proxy # this service owns its pins AND its pytest.ini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/model_proxy/requirements.txt

      # Deliberately NOT the agentd env: custom_auth.py needs litellm's proxy extra, which
      # agentd does not (and should not) carry. Same pins as the container, plus the runners.
      - name: Install (service pins + test deps)
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Contract tests (pytest)
        run: pytest -q

  clients:
    name: Clients (ui + desktop + web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/clients # npm WORKSPACE root (ui + desktop + web)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/clients/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (desktop shell + web client)
        run: |
          npm run build:desktop
          npm run build:web
