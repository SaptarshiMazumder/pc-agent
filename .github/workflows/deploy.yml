# ─────────────────────────────────────────────────────────────────────────────
# Deploy (ECS Fargate) — build/push all four images or one independent service, then roll it.
#
# ONE workflow, ALL environments. Environment is a PARAMETER, never a separate file:
#   • Manual:  pick `dev` / `staging` / `production`, then all services or one service.
#   • Auto:    push to `develop`     → deploys dev
#              push to `staging`     → deploys staging
#              push to `release/**`  → deploys production
#
# GATES (enforced by GitHub Environments, configured in repo Settings ▸ Environments):
#   • dev         — no reviewers, deploys immediately.
#   • staging     — required reviewers must approve before the deploy job runs.
#   • production  — required reviewers + deployment-branch policy `release/*`
#                   (a manual dispatch of `production` from any non-release branch is
#                    BLOCKED by that policy, so the gate holds regardless of trigger).
#
# WHY TWO JOBS: a job's `environment:` gate is evaluated BEFORE its steps run, so it
# cannot read a value computed in a step. `resolve` computes the env name and exposes it
# as a job OUTPUT; `deploy` reads it via `needs.resolve.outputs.environment`, which the
# environment key CAN see — that's what makes the reviewer/branch protection actually fire.
#
# This does DEPLOYMENT only (code → running containers). It does NOT run Terraform and needs
# NO Terraform state — the environment must already be PROVISIONED (you run `terraform apply`
# locally). Everything it needs it reads from the AWS API via the naming convention
# `agentd-<env>` / `agentd-<env>/<svc>`, so local Terraform state is irrelevant here.
#
# One-time setup (see v2/infra/github-oidc/):
#   • apply v2/infra/github-oidc  → creates the OIDC role
#   • add repo secret AWS_DEPLOY_ROLE_ARN = that role's ARN
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, staging, production]
        default: dev
      service:
        description: "Deploy all services or one independently"
        type: choice
        options: [all, model-proxy, accounts, daemon, web, ingest]
        default: all
      skip_tests:
        description: "Emergency only: deploy WITHOUT the test gate (e.g. rolling back past a broken commit)"
        type: boolean
        default: false
  push:
    branches: [develop, staging, "release/**"] # develop→dev, staging→staging, release/**→production
    paths: # only rebuild when something that ships actually changed
      - "v2/agent_runtime/**"
      - "v2/model_proxy/**"
      - "v2/accounts/**"
      - "v2/clients/**"
      - "v2/deploy/docker/**"
      - "v2/ingest/**"
      # monitoring/ is pip-installed INTO three of the four images, so a telemetry-only
      # change ships real code. Omitting it here would skip the deploy and leave the
      # containers running the old library while the repo says otherwise.
      - "v2/monitoring/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write # OIDC to AWS — no long-lived keys stored in GitHub
  contents: read

env:
  AWS_REGION: ap-northeast-1
  SERVICES: "model-proxy accounts daemon web ingest"

jobs:
  # ── Job 1: decide which environment. No AWS, no gate — its ONLY purpose is to produce
  # the env name in the `needs.*` context so Job 2's `environment:` key can read it.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      service: ${{ steps.env.outputs.service }}
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            SERVICE="${{ inputs.service }}"
          else
            case "${{ github.ref_name }}" in
              develop)    ENV=dev ;;
              staging)    ENV=staging ;;
              release/*)  ENV=production ;;
              *) echo "::error::no environment mapping for branch ${{ github.ref_name }}"; exit 1 ;;
            esac
            SERVICE=all
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: **$ENV**; service: **$SERVICE**" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: the GATE. ci-fast-tests.yml already runs on every push to develop, but it runs
  # ALONGSIDE this workflow, not before it — so without this job a red suite and a shipped image
  # are the same push. Anything that reaches AWS has passed the tests first.
  #
  # Deliberately NOT the whole of ci-fast-tests: this mirrors its `backend` job minus the
  # informational linters (ruff/mypy/import-linter are continue-on-error there — a gate that
  # cannot fail is not a gate, and one that blocks a deploy on style would get switched off).
  # Its `clients` job is skipped for a different reason: the web image build runs the client
  # build INSIDE Docker, so a broken client already fails the deploy a few steps later.
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    defaults:
      run:
        working-directory: v2 # conftest.py builds sys.path from here; pytest MUST run in v2/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            v2/pyproject.toml
            v2/monitoring/pyproject.toml

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      # Its own distribution, not an extra of agentd (see ci-fast-tests.yml). Every import site
      # has an optional-import no-op fallback, so without this the suite silently tests the
      # fallbacks — and the sandbox's own telemetry assertions would pass against nothing.
      - name: Install telemetry library (v2/monitoring)
        run: pip install -e monitoring

      - name: Unit tests (pytest)
        run: pytest tests/unit -q

      - name: Integration tests (pytest)
        run: pytest tests/integration -m "not live and not browser and not computer" -q

  # ── Job 3: the actual deploy. `environment:` binds it to the matching GitHub Environment,
  # so its protection rules (reviewers for staging/production, branch policy for production)
  # pause/authorize THIS job before any step runs.
  deploy:
    # An explicit status check rather than the default: `test` is SKIPPED when skip_tests is set,
    # and a skipped dependency would otherwise skip this job with it. `!failure()` is a status
    # function, so GitHub does NOT also insert the implicit success() — a skipped gate lets the
    # deploy through, a red one does not.
    needs: [resolve, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      DEPLOY_SERVICE: ${{ needs.resolve.outputs.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the next step diffs this push against its predecessor to decide
          # which images actually need rebuilding. The default shallow clone has no predecessor to
          # diff against, and `fetch-depth: 2` is not enough either: a push can carry several
          # commits, and diffing only against HEAD~1 would miss files changed earlier in the same
          # push — silently skipping an image that needed rebuilding.
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Buildx, for one reason: a LAYER CACHE. A GitHub runner is a fresh VM, so plain
      # `docker build` starts with an empty cache on every run and rebuilds every layer from
      # scratch — apt upgrades, pip installs, `npm ci`, `uv tool install`. The Dockerfiles are
      # already written to be cacheable (web copies package.json before `npm ci` precisely so npm
      # can be cached); there was simply no cache for them to hit.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # WHICH IMAGES ACTUALLY NEED BUILDING. The `paths:` filter at the top decides whether this
      # workflow RUNS; it says nothing about which of the five images a change affects. So a
      # one-line edit in agent_runtime/ used to rebuild web, ingest, accounts and model-proxy too,
      # and then roll all five and wait for each to stabilize.
      #
      # THE SAFETY RULE, applied everywhere below: when in doubt, BUILD. Skipping an image that
      # needed rebuilding ships stale code and reports success — the worst failure this workflow
      # has. An unnecessary build only costs minutes.
      - name: Decide which images to build
        id: changed
        run: |
          emit() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          # A manual run states exactly what it wants; there is no diff to consult.
          if [ "$DEPLOY_SERVICE" != "all" ]; then
            emit "$DEPLOY_SERVICE" "manual run: building $DEPLOY_SERVICE only"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            emit "$SERVICES" "manual 'all' run: building every image"; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              emit "$SERVICES" "no diff base (new branch or force push): building every image"; exit 0 ;;
          esac
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            emit "$SERVICES" "diff base ${BEFORE} unreachable: building every image"; exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}"); then
            emit "$SERVICES" "git diff failed: building every image"; exit 0
          fi
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # `if`, never `cmd && VAR=...`: this step runs under `bash -e`, where a false `&&`
          # chain is a failing command and aborts the whole step. That exact shape has broken
          # this workflow before.
          touched() { echo "$CHANGED" | grep -qE "$1"; }

          # The path->image map is read off each Dockerfile's COPY lines, not guessed:
          #   model-proxy  model_proxy/requirements.txt, litellm.config.yaml, custom_auth, metering
          #   accounts     accounts/requirements.txt, app.py, ledger.py, payments.py
          #   ingest       ingest/requirements.txt, app.py
          #   web          the whole clients/ npm workspace (root + ui/ + web/ + desktop manifest)
          #   daemon       the WHEEL, so effectively all of v2 the .dockerignore lets through:
          #                agent_runtime/, plugins/, agents/, scripts/, pyproject.toml, deploy/docker/
          # monitoring/ is pip-installed INTO four of the five images, so it rebuilds all but web.
          # This workflow file changes HOW everything is built, so it rebuilds everything.
          WF='^\.github/workflows/deploy\.yml$'
          SHARED="^v2/monitoring/|$WF"
          TO_BUILD=""
          if touched "$SHARED|^v2/model_proxy/"; then TO_BUILD="$TO_BUILD model-proxy"; fi
          if touched "$SHARED|^v2/accounts/";    then TO_BUILD="$TO_BUILD accounts"; fi
          if touched "$SHARED|^v2/ingest/";      then TO_BUILD="$TO_BUILD ingest"; fi
          if touched "^v2/clients/|$WF";         then TO_BUILD="$TO_BUILD web"; fi
          if touched "$SHARED|^v2/agent_runtime/|^v2/plugins/|^v2/agents/|^v2/scripts/|^v2/pyproject\.toml$|^v2/deploy/docker/"; then
            TO_BUILD="$TO_BUILD daemon"
          fi

          TO_BUILD=$(echo "$TO_BUILD" | xargs || true)
          if [ -z "$TO_BUILD" ]; then
            # Reachable: the `paths:` filter is coarser than this map (a v2/agents/ change with no
            # bundle impact, say). Nothing to build is a legitimate outcome, not an error.
            emit "" "no image is affected by these changes — nothing to build or roll"
          else
            emit "$TO_BUILD" "building: $TO_BUILD"
          fi

      # Resolve the registry + THIS env's public ALB hostname straight from the AWS API.
      - name: Resolve registry + ALB url
        id: aws
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "agentd-${ENVIRONMENT}" \
            --query 'LoadBalancers[0].DNSName' --output text)
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "::error::no ALB named agentd-${ENVIRONMENT} — provision the environment first (terraform apply)"; exit 1
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "alb=$ALB_DNS"       >> "$GITHUB_OUTPUT"

      # Build + push the AFFECTED images, tagged with the git SHA (immutable) AND :latest.
      # `web` bakes the ALB url in at build time; the other four don't.
      - name: Build and push images
        run: |
          REG="${{ steps.aws.outputs.registry }}"
          ALB="${{ steps.aws.outputs.alb }}"
          SHA="${{ github.sha }}"
          build() { # name  context  dockerfile  [extra build args...]
            local name="$1" ctx="$2" df="$3"; shift 3
            local uri="${REG}/agentd-${ENVIRONMENT}/${name}"
            echo "::group::build $name"
            # ONE buildx invocation replaces build + two pushes: `--push` uploads both tags in a
            # single pass, and the cache flags are only available on buildx anyway.
            #
            # The cache lives in the service's OWN ECR repo under a `:buildcache` tag, so it needs
            # no extra infrastructure and is naturally per-environment.
            #
            # `image-manifest=true,oci-mediatypes=true` is REQUIRED for ECR: it rejects buildkit's
            # default cache manifest type, and without these the export fails on every run.
            #
            # `ignore-error=true` is the load-bearing one. Populating a cache is an optimisation,
            # and an optimisation must never be able to fail a deploy — an environment built with
            # image_tag_mutability = IMMUTABLE cannot accept a repeated `:buildcache` push at all,
            # and that must degrade to "no cache", not to a red build.
            docker buildx build \
              --push \
              -t "${uri}:${SHA}" -t "${uri}:latest" \
              --cache-from "type=registry,ref=${uri}:buildcache" \
              --cache-to "type=registry,ref=${uri}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
              -f "$df" "$@" "$ctx"
            echo "::endgroup::"
          }
          BUILD_LIST="${{ steps.changed.outputs.build }}"
          want() { case " $BUILD_LIST " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          if [ -z "$BUILD_LIST" ]; then echo "nothing to build"; fi
          # NOTE: model-proxy and accounts build from the v2/ context (not their own folder)
          # so both images can install the shared telemetry library at v2/monitoring/. Their
          # Dockerfiles still COPY only the handful of files each service needs.
          if want model-proxy; then
            build model-proxy v2 v2/model_proxy/Dockerfile
          fi
          if want accounts; then
            build accounts v2 v2/accounts/Dockerfile
          fi
          if want daemon; then
            build daemon v2 v2/deploy/docker/Dockerfile
          fi
          if want web; then
            # The web build bakes its endpoints in, so a new one is a new build arg. INGEST is
            # OPTIONAL by design: an empty value leaves the browser reporter inert, which is what
            # a build for an environment without an ingest service should do.
            build web v2/clients v2/clients/web/Dockerfile \
              --build-arg "VITE_AGENTD_ACCOUNTS_URL=http://${ALB}:4100" \
              --build-arg "VITE_AGENTD_URL=ws://${ALB}:8787" \
              --build-arg "VITE_AGENTD_INGEST_URL=http://${ALB}:4200"
          fi
          if want ingest; then
            build ingest v2 v2/ingest/Dockerfile
          fi

      # Record the deployment id each roll creates. The next step needs it: "the services are
      # stable" and "the deploy worked" are NOT the same claim once the circuit breaker can
      # roll back (see below), and the id is the only thing that tells them apart.
      - name: Roll ECS services
        run: |
          # Roll exactly what was rebuilt. Rolling a service whose image did not change is not
          # harmful — it restarts on the same image — but it is where the wall clock goes: the
          # daemon alone takes ~3 minutes to drain and pass health checks, and the wait step then
          # blocks on it. This is the other half of "build only what changed".
          TARGET_SERVICES="${{ steps.changed.outputs.build }}"
          : > deployments.txt
          if [ -z "$TARGET_SERVICES" ]; then
            echo "::notice::no image changed — nothing to roll"
            echo "Nothing to deploy to **$ENVIRONMENT**: no image was affected by these changes ⏭" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for svc in $TARGET_SERVICES; do
            name="agentd-${ENVIRONMENT}-${svc}"
            # HIBERNATED ENVIRONMENTS HAVE NO ECS SERVICES. `terraform apply -var hibernate=true`
            # removes them along with the ALB to get the bill to ~$3/month, and a merge to
            # develop still runs this workflow — which used to die on the first update-service
            # for something that does not exist. Skipping is right rather than failing: the
            # images ARE still built and pushed to ECR above, so waking the environment with
            # `terraform apply` starts tasks on the image this very run produced.
            status=$(aws ecs describe-services --cluster "agentd-${ENVIRONMENT}" --services "$name" \
              --region "$AWS_REGION" --query "services[0].status" --output text 2>/dev/null || echo "MISSING")
            if [ "$status" != "ACTIVE" ]; then
              echo "::notice::$name is ${status} — skipping the roll. The image is in ECR; \`terraform apply\` will start it."
              continue
            fi
            id=$(aws ecs update-service --cluster "agentd-${ENVIRONMENT}" --service "$name" \
              --force-new-deployment --region "$AWS_REGION" \
              --query "service.deployments[?status=='PRIMARY'].id" --output text)
            echo "$svc $id" >> deployments.txt
            echo "rolled $name ($id)"
          done
          if [ ! -s deployments.txt ]; then
            echo "No running services to roll — the **$ENVIRONMENT** environment is hibernated. Images were pushed; \`terraform apply\` brings it back. ⏸" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The services' ECS deployment circuit breaker (infra/modules/services.tf) makes a broken
      # image fail instead of crash-looping forever, and ROLLS BACK to the last good task set.
      # That rollback is why `wait services-stable` is not sufficient on its own: it returns
      # SUCCESS once things settle, and a rolled-back service settles perfectly well — so a
      # bare waiter reports a green deploy for an image that never ran. Waiting and then
      # asserting on OUR deployment id is what makes the step's success mean what it says.
      - name: Wait for services to stabilize
        run: |
          CLUSTER="agentd-${ENVIRONMENT}"
          # Nothing was rolled (hibernated environment) — there is nothing to wait for, and
          # `wait services-stable` with an empty service list is an error, not a no-op.
          if [ ! -s deployments.txt ]; then
            echo "nothing rolled; skipping the stability wait"
            exit 0
          fi
          # WAIT BY POLLING OUR OWN DEPLOYMENT IDS, not with `aws ecs wait services-stable`.
          #
          # The waiter was here and was replaced, because it can report "not stable" — or return
          # early — for reasons that have nothing to do with our rollout, and the verdict below
          # then read rolloutState ONCE, immediately, and called a healthy deploy a failure. That
          # happened: four services showed COMPLETED, the daemon showed IN_PROGRESS, the job went
          # red, and the deployment finished normally three minutes later. A CI check that cries
          # wolf is worse than no check, because the next real failure gets ignored too.
          #
          # Polling the DEPLOYMENT ID answers the actual question ("did the thing we just started
          # finish?") instead of a proxy for it, needs no fixed 40x15s budget, and reports per
          # service. It costs one describe-services per service per 15s, and it exits the moment
          # every deployment has settled.
          #
          # The daemon is the slow one by design: health_check_grace 120s + two ALB checks 30s
          # apart + deregistration_delay 120s for its long-lived WebSocket sessions, on top of
          # loading the whole agent runtime. VERDICT_TIMEOUT_S is the ceiling per service.
          VERDICT_TIMEOUT_S=${VERDICT_TIMEOUT_S:-1200}

          settle_state() {
            _name="$1"; _id="$2"
            _deadline=$(( $(date +%s) + VERDICT_TIMEOUT_S ))
            while :; do
              # Only a SUCCESSFUL call is allowed to conclude anything. An API error returns
              # nothing too, and treating that as "the deployment vanished" would turn a throttle
              # into a reported rollback.
              if _raw=$(aws ecs describe-services --cluster "$CLUSTER" --services "$_name" \
                          --region "$AWS_REGION" \
                          --query "services[0].deployments[?id=='${_id}'].rolloutState" \
                          --output text 2>/dev/null); then
                # Empty from a successful call = our deployment is gone: superseded by a rollback.
                [ "$_raw" = "IN_PROGRESS" ] || { echo "$_raw"; return 0; }
              fi
              [ "$(date +%s)" -lt "$_deadline" ] || { echo "IN_PROGRESS"; return 0; }
              sleep 15
            done
          }

          failed=0
          while read -r svc id; do
            name="${CLUSTER}-${svc}"
            state=$(settle_state "$name" "$id")
            # Empty means our deployment is gone entirely — superseded by a rollback.
            if [ "$state" = "COMPLETED" ]; then
              echo "✅ $name — $state"
              continue
            fi
            failed=1
            echo "::error::$name did not deploy (rolloutState: ${state:-superseded by rollback})"
            # EVERY diagnostic below is `|| true`. The job runs under `bash -e`, so one failing
            # command aborts the step — and these run only when something is ALREADY broken, so
            # aborting here replaces the verdict with the diagnostic's own error. That is exactly
            # what happened when the deploy role was missing ecs:ListTasks: exit 254, an IAM
            # message, and no word about which service failed or why. A diagnostic that can
            # suppress the diagnosis is worse than no diagnostic.
            aws ecs describe-services --cluster "$CLUSTER" --services "$name" --region "$AWS_REGION" \
              --query "services[0].{reason:deployments[?id=='${id}'].rolloutStateReason,events:events[0:5].message}" || true
            # The container's own exit reason — usually the actual answer.
            stopped=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$name" --region "$AWS_REGION" \
              --desired-status STOPPED --query 'taskArns[0:3]' --output text 2>/dev/null || true)
            if [ -n "$stopped" ] && [ "$stopped" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks $stopped --region "$AWS_REGION" \
                --query "tasks[].{stopped:stoppedReason,containers:containers[].{name:name,reason:reason,exit:exitCode}}" || true
            fi
            # The log group is /<project>/<env> (infra/modules/cluster.tf) — NOT the /ecs/<cluster>
            # that ECS uses by default, because the awslogs driver is configured explicitly.
            echo "logs: aws logs tail /agentd/${ENVIRONMENT} --since 30m --region ${AWS_REGION} --log-stream-name-prefix ${svc}" >&2
          done < deployments.txt

          if [ "$failed" = 1 ]; then
            echo "Deploy to **$ENVIRONMENT** FAILED — see the annotations above ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Services **$(cut -d' ' -f1 deployments.txt | tr '\n' ' ')** deployed to **$ENVIRONMENT** ✅" >> "$GITHUB_STEP_SUMMARY"
