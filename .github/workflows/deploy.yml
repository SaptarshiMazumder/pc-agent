# ─────────────────────────────────────────────────────────────────────────────
# Deploy (ECS Fargate) — build the 4 images, push to ECR, roll the services.
#
# ONE workflow, BOTH environments. Environment is a PARAMETER, never a separate file:
#   • Manual:  Actions ▸ Deploy ▸ Run workflow ▸ pick `dev` or `staging`.
#   • Auto:    push to `develop` → deploys dev;  push to `staging` → deploys staging.
#
# This does DEPLOYMENT only (code → running containers). It does NOT run Terraform and needs
# NO Terraform state — the environment must already be PROVISIONED (you run `terraform apply`
# locally). Everything it needs it reads from the AWS API via the naming convention
# `agentd-<env>` / `agentd-<env>/<svc>`, so local Terraform state is irrelevant here.
#
# One-time setup (see v2/infra/github-oidc/):
#   • apply v2/infra/github-oidc  → creates the OIDC role
#   • add repo secret AWS_DEPLOY_ROLE_ARN = that role's ARN
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, staging]
        default: dev
  push:
    branches: [develop, staging] # develop → dev, staging → staging (mapped below)
    paths: # only rebuild when something that ships actually changed
      - "v2/agentd/**"
      - "v2/deploy/accounts/**"
      - "v2/clients/desktop/**"
      - "v2/deploy/docker/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write # OIDC to AWS — no long-lived keys stored in GitHub
  contents: read

env:
  AWS_REGION: ap-northeast-1
  SERVICES: "gateway accounts daemon web"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dev/staging in ONE place: manual input wins; otherwise map the pushed branch.
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              develop) ENV=dev ;;
              staging) ENV=staging ;;
              *) echo "::error::no environment mapping for branch ${{ github.ref_name }}"; exit 1 ;;
            esac
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Deploying environment: **$ENV**" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Resolve the registry + THIS env's public ALB hostname straight from the AWS API.
      - name: Resolve registry + ALB url
        id: aws
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "agentd-${ENV}" \
            --query 'LoadBalancers[0].DNSName' --output text)
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "::error::no ALB named agentd-${ENV} — provision the environment first (terraform apply)"; exit 1
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "alb=$ALB_DNS"       >> "$GITHUB_OUTPUT"

      # Build + push all 4 images, tagged with the git SHA (immutable) AND :latest.
      # `web` bakes the ALB url in at build time; the other three don't.
      - name: Build and push images
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          REG="${{ steps.aws.outputs.registry }}"
          ALB="${{ steps.aws.outputs.alb }}"
          SHA="${{ github.sha }}"
          build() { # name  context  dockerfile  [extra build args...]
            local name="$1" ctx="$2" df="$3"; shift 3
            local uri="${REG}/agentd-${ENV}/${name}"
            echo "::group::build $name"
            docker build -t "${uri}:${SHA}" -t "${uri}:latest" -f "$df" "$@" "$ctx"
            docker push "${uri}:${SHA}"
            docker push "${uri}:latest"
            echo "::endgroup::"
          }
          build gateway  v2                  v2/deploy/docker/Dockerfile.gateway
          build accounts v2                  v2/deploy/docker/Dockerfile.accounts
          build daemon   v2                  v2/deploy/docker/Dockerfile
          build web      v2/clients/desktop  v2/clients/desktop/Dockerfile.web \
            --build-arg "VITE_AGENTD_ACCOUNTS_URL=http://${ALB}:4100" \
            --build-arg "VITE_AGENTD_URL=ws://${ALB}:8787"

      - name: Roll ECS services
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          for svc in $SERVICES; do
            aws ecs update-service --cluster "agentd-${ENV}" --service "agentd-${ENV}-${svc}" \
              --force-new-deployment --region "$AWS_REGION" >/dev/null
            echo "rolled agentd-${ENV}-${svc}"
          done

      - name: Wait for services to stabilize
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          aws ecs wait services-stable --cluster "agentd-${ENV}" \
            --services $(for s in $SERVICES; do echo "agentd-${ENV}-$s"; done) --region "$AWS_REGION"
          echo "All services stable for **$ENV** ✅" >> "$GITHUB_STEP_SUMMARY"
