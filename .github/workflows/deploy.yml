# ─────────────────────────────────────────────────────────────────────────────
# Deploy (ECS Fargate) — build/push all four images or one independent service, then roll it.
#
# ONE workflow, ALL environments. Environment is a PARAMETER, never a separate file:
#   • Manual:  pick `dev` / `staging` / `production`, then all services or one service.
#   • Auto:    push to `develop`     → deploys dev
#              push to `staging`     → deploys staging
#              push to `release/**`  → deploys production
#
# GATES (enforced by GitHub Environments, configured in repo Settings ▸ Environments):
#   • dev         — no reviewers, deploys immediately.
#   • staging     — required reviewers must approve before the deploy job runs.
#   • production  — required reviewers + deployment-branch policy `release/*`
#                   (a manual dispatch of `production` from any non-release branch is
#                    BLOCKED by that policy, so the gate holds regardless of trigger).
#
# WHY TWO JOBS: a job's `environment:` gate is evaluated BEFORE its steps run, so it
# cannot read a value computed in a step. `resolve` computes the env name and exposes it
# as a job OUTPUT; `deploy` reads it via `needs.resolve.outputs.environment`, which the
# environment key CAN see — that's what makes the reviewer/branch protection actually fire.
#
# This does DEPLOYMENT only (code → running containers). It does NOT run Terraform and needs
# NO Terraform state — the environment must already be PROVISIONED (you run `terraform apply`
# locally). Everything it needs it reads from the AWS API via the naming convention
# `agentd-<env>` / `agentd-<env>/<svc>`, so local Terraform state is irrelevant here.
#
# One-time setup (see v2/infra/github-oidc/):
#   • apply v2/infra/github-oidc  → creates the OIDC role
#   • add repo secret AWS_DEPLOY_ROLE_ARN = that role's ARN
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, staging, production]
        default: dev
      service:
        description: "Deploy all services or one independently"
        type: choice
        options: [all, model-proxy, accounts, daemon, web, ingest]
        default: all
  push:
    branches: [develop, staging, "release/**"] # develop→dev, staging→staging, release/**→production
    paths: # only rebuild when something that ships actually changed
      - "v2/agent_runtime/**"
      - "v2/model_proxy/**"
      - "v2/accounts/**"
      - "v2/clients/**"
      - "v2/deploy/docker/**"
      - "v2/ingest/**"
      # monitoring/ is pip-installed INTO three of the four images, so a telemetry-only
      # change ships real code. Omitting it here would skip the deploy and leave the
      # containers running the old library while the repo says otherwise.
      - "v2/monitoring/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write # OIDC to AWS — no long-lived keys stored in GitHub
  contents: read

env:
  AWS_REGION: ap-northeast-1
  SERVICES: "model-proxy accounts daemon web ingest"

jobs:
  # ── Job 1: decide which environment. No AWS, no gate — its ONLY purpose is to produce
  # the env name in the `needs.*` context so Job 2's `environment:` key can read it.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      service: ${{ steps.env.outputs.service }}
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            SERVICE="${{ inputs.service }}"
          else
            case "${{ github.ref_name }}" in
              develop)    ENV=dev ;;
              staging)    ENV=staging ;;
              release/*)  ENV=production ;;
              *) echo "::error::no environment mapping for branch ${{ github.ref_name }}"; exit 1 ;;
            esac
            SERVICE=all
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: **$ENV**; service: **$SERVICE**" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: the actual deploy. `environment:` binds it to the matching GitHub Environment,
  # so its protection rules (reviewers for staging/production, branch policy for production)
  # pause/authorize THIS job before any step runs.
  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      DEPLOY_SERVICE: ${{ needs.resolve.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Resolve the registry + THIS env's public ALB hostname straight from the AWS API.
      - name: Resolve registry + ALB url
        id: aws
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "agentd-${ENVIRONMENT}" \
            --query 'LoadBalancers[0].DNSName' --output text)
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "::error::no ALB named agentd-${ENVIRONMENT} — provision the environment first (terraform apply)"; exit 1
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "alb=$ALB_DNS"       >> "$GITHUB_OUTPUT"

      # Build + push all 4 images, tagged with the git SHA (immutable) AND :latest.
      # `web` bakes the ALB url in at build time; the other three don't.
      - name: Build and push images
        run: |
          REG="${{ steps.aws.outputs.registry }}"
          ALB="${{ steps.aws.outputs.alb }}"
          SHA="${{ github.sha }}"
          build() { # name  context  dockerfile  [extra build args...]
            local name="$1" ctx="$2" df="$3"; shift 3
            local uri="${REG}/agentd-${ENVIRONMENT}/${name}"
            echo "::group::build $name"
            docker build -t "${uri}:${SHA}" -t "${uri}:latest" -f "$df" "$@" "$ctx"
            docker push "${uri}:${SHA}"
            docker push "${uri}:latest"
            echo "::endgroup::"
          }
          want() { [ "$DEPLOY_SERVICE" = "all" ] || [ "$DEPLOY_SERVICE" = "$1" ]; }
          # NOTE: model-proxy and accounts build from the v2/ context (not their own folder)
          # so both images can install the shared telemetry library at v2/monitoring/. Their
          # Dockerfiles still COPY only the handful of files each service needs.
          if want model-proxy; then
            build model-proxy v2 v2/model_proxy/Dockerfile
          fi
          if want accounts; then
            build accounts v2 v2/accounts/Dockerfile
          fi
          if want daemon; then
            build daemon v2 v2/deploy/docker/Dockerfile
          fi
          if want web; then
            # The web build bakes its endpoints in, so a new one is a new build arg. INGEST is
            # OPTIONAL by design: an empty value leaves the browser reporter inert, which is what
            # a build for an environment without an ingest service should do.
            build web v2/clients v2/clients/web/Dockerfile \
              --build-arg "VITE_AGENTD_ACCOUNTS_URL=http://${ALB}:4100" \
              --build-arg "VITE_AGENTD_URL=ws://${ALB}:8787" \
              --build-arg "VITE_AGENTD_INGEST_URL=http://${ALB}:4200"
          fi
          if want ingest; then
            build ingest v2 v2/ingest/Dockerfile
          fi

      # Record the deployment id each roll creates. The next step needs it: "the services are
      # stable" and "the deploy worked" are NOT the same claim once the circuit breaker can
      # roll back (see below), and the id is the only thing that tells them apart.
      - name: Roll ECS services
        run: |
          TARGET_SERVICES="$SERVICES"
          if [ "$DEPLOY_SERVICE" != "all" ]; then TARGET_SERVICES="$DEPLOY_SERVICE"; fi
          : > deployments.txt
          for svc in $TARGET_SERVICES; do
            name="agentd-${ENVIRONMENT}-${svc}"
            # HIBERNATED ENVIRONMENTS HAVE NO ECS SERVICES. `terraform apply -var hibernate=true`
            # removes them along with the ALB to get the bill to ~$3/month, and a merge to
            # develop still runs this workflow — which used to die on the first update-service
            # for something that does not exist. Skipping is right rather than failing: the
            # images ARE still built and pushed to ECR above, so waking the environment with
            # `terraform apply` starts tasks on the image this very run produced.
            status=$(aws ecs describe-services --cluster "agentd-${ENVIRONMENT}" --services "$name" \
              --region "$AWS_REGION" --query "services[0].status" --output text 2>/dev/null || echo "MISSING")
            if [ "$status" != "ACTIVE" ]; then
              echo "::notice::$name is ${status} — skipping the roll. The image is in ECR; \`terraform apply\` will start it."
              continue
            fi
            id=$(aws ecs update-service --cluster "agentd-${ENVIRONMENT}" --service "$name" \
              --force-new-deployment --region "$AWS_REGION" \
              --query "service.deployments[?status=='PRIMARY'].id" --output text)
            echo "$svc $id" >> deployments.txt
            echo "rolled $name ($id)"
          done
          if [ ! -s deployments.txt ]; then
            echo "No running services to roll — the **$ENVIRONMENT** environment is hibernated. Images were pushed; \`terraform apply\` brings it back. ⏸" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The services' ECS deployment circuit breaker (infra/modules/services.tf) makes a broken
      # image fail instead of crash-looping forever, and ROLLS BACK to the last good task set.
      # That rollback is why `wait services-stable` is not sufficient on its own: it returns
      # SUCCESS once things settle, and a rolled-back service settles perfectly well — so a
      # bare waiter reports a green deploy for an image that never ran. Waiting and then
      # asserting on OUR deployment id is what makes the step's success mean what it says.
      - name: Wait for services to stabilize
        run: |
          CLUSTER="agentd-${ENVIRONMENT}"
          # Nothing was rolled (hibernated environment) — there is nothing to wait for, and
          # `wait services-stable` with an empty service list is an error, not a no-op.
          if [ ! -s deployments.txt ]; then
            echo "nothing rolled; skipping the stability wait"
            exit 0
          fi
          SVC_NAMES=$(while read -r svc _; do echo "${CLUSTER}-${svc}"; done < deployments.txt)

          # Don't fail here: the waiter's own timeout is a far worse error message than the
          # per-service verdict below, which can say WHICH service and WHY.
          #
          # LOOPED, because `wait services-stable` has a FIXED, non-configurable budget of
          # 40 attempts x 15s = 10 minutes, and the daemon legitimately needs more than that:
          # health_check_grace 120s + two ALB checks 30s apart + deregistration_delay 120s for
          # its long-lived WebSocket sessions, on top of loading the whole agent runtime. Ten
          # minutes was enough until a fifth service joined the roll; then the daemon was still
          # in its final drain when the waiter gave up, and a deploy that worked was reported
          # as a failure. Three passes = a 30-minute ceiling, and it exits as soon as ECS says
          # stable, so a fast deploy costs nothing extra.
          for attempt in 1 2 3; do
            if aws ecs wait services-stable --cluster "$CLUSTER" --services $SVC_NAMES --region "$AWS_REGION"; then
              break
            fi
            echo "waiter pass $attempt timed out; services still settling"
          done

          failed=0
          while read -r svc id; do
            name="${CLUSTER}-${svc}"
            state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$name" --region "$AWS_REGION" \
              --query "services[0].deployments[?id=='${id}'].rolloutState" --output text)
            # Empty means our deployment is gone entirely — superseded by a rollback.
            if [ "$state" = "COMPLETED" ]; then
              echo "✅ $name — $state"
              continue
            fi
            failed=1
            echo "::error::$name did not deploy (rolloutState: ${state:-superseded by rollback})"
            # EVERY diagnostic below is `|| true`. The job runs under `bash -e`, so one failing
            # command aborts the step — and these run only when something is ALREADY broken, so
            # aborting here replaces the verdict with the diagnostic's own error. That is exactly
            # what happened when the deploy role was missing ecs:ListTasks: exit 254, an IAM
            # message, and no word about which service failed or why. A diagnostic that can
            # suppress the diagnosis is worse than no diagnostic.
            aws ecs describe-services --cluster "$CLUSTER" --services "$name" --region "$AWS_REGION" \
              --query "services[0].{reason:deployments[?id=='${id}'].rolloutStateReason,events:events[0:5].message}" || true
            # The container's own exit reason — usually the actual answer.
            stopped=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$name" --region "$AWS_REGION" \
              --desired-status STOPPED --query 'taskArns[0:3]' --output text 2>/dev/null || true)
            if [ -n "$stopped" ] && [ "$stopped" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks $stopped --region "$AWS_REGION" \
                --query "tasks[].{stopped:stoppedReason,containers:containers[].{name:name,reason:reason,exit:exitCode}}" || true
            fi
            # The log group is /<project>/<env> (infra/modules/cluster.tf) — NOT the /ecs/<cluster>
            # that ECS uses by default, because the awslogs driver is configured explicitly.
            echo "logs: aws logs tail /agentd/${ENVIRONMENT} --since 30m --region ${AWS_REGION} --log-stream-name-prefix ${svc}" >&2
          done < deployments.txt

          if [ "$failed" = 1 ]; then
            echo "Deploy to **$ENVIRONMENT** FAILED — see the annotations above ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Services **$(cut -d' ' -f1 deployments.txt | tr '\n' ' ')** deployed to **$ENVIRONMENT** ✅" >> "$GITHUB_STEP_SUMMARY"
