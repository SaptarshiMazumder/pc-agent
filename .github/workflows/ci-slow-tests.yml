# Stage 2 - Slow tests: the ones that need real infrastructure, selected by ENVIRONMENT
# markers (browser = real Chromium, live = provider APIs + secrets, computer = display/driver).
# Not to be confused with the tests/integration TIER (in-process, runs in ci-fast-tests.yml
# on every push) — the 3 browser-marked files live there but are excluded from the fast run
# and picked up here. NOT run on every push - only on merges to develop/main and on-demand -
# because they're slower and (in future) will need secrets.
name: CI slow tests

on:
  # NOT on push (removed 2026-08-08, user's call): a push to develop is a DEPLOY, and nothing
  # test-shaped should run alongside it. On-demand only until asked otherwise.
  workflow_dispatch: {}          # run on-demand from the Actions tab
  # schedule:
  #   - cron: '0 6 * * *'        # (optional) nightly - uncomment to enable

concurrency:
  group: ci-slow-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    name: Browser + live tests
    runs-on: ubuntu-latest
    # No `if:` guard: workflow_dispatch is the only trigger, and dispatch is already restricted to
    # people with write access — so the fork-PR-can't-read-secrets case cannot arise. Re-add the
    # guard together with any pull_request trigger, never separately.
    defaults:
      run:
        working-directory: v2
    # Provider keys go here once real `live` tests exist (none today):
    # env:
    #   GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            v2/pyproject.toml
            v2/monitoring/pyproject.toml

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      # Its own distribution, not an extra — see the note in ci-fast-tests.yml.
      - name: Install telemetry library (v2/monitoring)
        run: pip install -e monitoring

      - name: Install Chromium (with OS deps) for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run integration tests (browser / live / computer)
        run: pytest -m "browser or live or computer" -q
